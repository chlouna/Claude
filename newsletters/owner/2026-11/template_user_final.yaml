                      width: 100%
                  content: '<p><span style="color: rgb(0, 0, 0);">Décembre approche, et avec lui les fêtes de fin d’année. Pour les routiers, c’est une période chargée&nbsp;: ils préparent leurs arrêts à l’avance et vérifient dans l’appli où ils pourront manger, se doucher et dormir.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">C’est le moment de <strong>leur dire clairement si vous êtes ouvert ou fermé.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Ce mois-ci, nous vous montrons comment le faire en quelques minutes.</span></p>'
