                      text-valign: top
                      valign: top
                      width: 95%
                  content: '<p><strong><span style="background-color: rgb(228, 234, 242); color: rgb(6, 24, 102);">Votre levier&nbsp;:</span></strong><span style="color: rgb(6, 24, 102); background-color: rgb(228, 234, 242);">&nbsp;déclarez vos dates dès maintenant, pour que les routiers qui préparent leurs trajets de décembre les voient à temps.</span></p>'
