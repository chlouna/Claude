              text-valign: top
              valign: top
              width: 100%
          content: '<h2 class="default-heading2"><span style="color: rgb(6, 24, 102);">Fermé pendant les fêtes&nbsp;? Utilisez la fermeture temporaire</span></h2>'
        - id: 2938fc82-1ebe-4376-8fb8-c434c8fb7135
          title: Paragraphe
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              padding-bottom: 15px
              padding-left: 10px
              padding-right: 10px
              padding-top: 15px
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><span style="color: rgb(0, 0, 0);">En fin d’année, certains d’entre vous annoncent leurs dates de congés dans la description de leur fiche ou en laissant un commentaire. Mais un routier pressé ne les voit pas toujours… et risque de trouver porte close.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">La fonctionnalité <strong>Fermeture temporaire</strong> est faite pour ça&nbsp;: pendant vos dates de fermeture, <strong>le marqueur de votre établissement devient transparent sur la carte</strong> et <strong>un message en rouge apparaît sur votre fiche.</strong> Tout revient à la normale automatiquement dès votre réouverture.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Comment faire&nbsp;?</strong></span></p><ol><li style="color: rgb(0, 0, 0);">Connectez-vous à votre <a href="https://truckfly.com/owner/login?utm_source=brevo&utm_medium=newsletter" target="_blank" style="color: rgb(0, 146, 255); text-decoration: underline;">espace propriétaire</a>.</li><li style="color: rgb(0, 0, 0);">Cliquez sur «&nbsp;Mes horaires d’ouverture&nbsp;» dans le menu à gauche.</li><li style="color: rgb(0, 0, 0);">Dans «&nbsp;Ma fermeture temporaire&nbsp;», indiquez vos dates de début et de fin, puis enregistrez.</li></ol><p><br></p><p><span style="color: rgb(0, 0, 0);">Besoin d’aide&nbsp;? <a href="https://faq.truckfly.com/hc/fr/categories/360006219672-FAQ-pour-les-propri%C3%A9taires-d-%C3%A9tablissement" target="_blank" style="color: rgb(0, 146, 255); text-decoration: underline;">Consultez notre FAQ propriétaires</a></span></p>'
        - id: f6f9624e-c552-43f2-8c68-d736e518832b
          title: Text
          type: text
          layout:
            320px:
              text-align: left
              width: 100%
            default:
              align: left
              background-color: '#e4eaf2'
