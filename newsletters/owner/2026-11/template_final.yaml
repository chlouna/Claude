          content: '<p style="color:#3c4858;font-family:''Roboto'',''Verdana'',Geneva,sans-serif;font-size:24px;"><span style="background-color: transparent; color: rgb(0, 0, 0); font-size: 24px;"><strong>Bonjour </strong></span><span style="color: rgb(0, 0, 0);">{{ contact.PRENOM }}</span><span style="background-color: transparent; color: rgb(0, 0, 0); font-size: 24px;"><strong>,</strong></span></p>'
