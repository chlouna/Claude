          content: '<p><span style="color: rgb(6, 24, 102);"><strong>Au programme&nbsp;:&nbsp;</strong></span></p><p><span {BL}><strong><br></strong></span></p><p><span style="color: rgb(6, 24, 102);"><strong>1.&nbsp;</strong><strong>Fermé pendant les fêtes&nbsp;? La fermeture temporaire</strong></span></p><p><span style="color: rgb(6, 24, 102);"><br></span></p><p><span style="color: rgb(6, 24, 102);"><strong>2.&nbsp;</strong><strong>Le conseil du mois&nbsp;: vos horaires des fêtes</strong></span></p><p><span style="color: rgb(6, 24, 102);"><br></span></p><p><span style="color: rgb(6, 24, 102);"><strong>3.&nbsp;</strong><strong>Nouveau&nbsp;: les routiers peuvent liker les avis</strong></span></p><p><span style="color: rgb(6, 24, 102);"><br></span></p><p><span style="color: rgb(6, 24, 102);"><strong>4.&nbsp;</strong><strong>Votre fiche aux couleurs de Noël</strong></span></p>'
