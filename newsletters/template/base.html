<!DOCTYPE html>
<html lang="$lang" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>$objet</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table,td,div,p,a,span{font-family:Arial,Helvetica,sans-serif !important;}</style>
<![endif]-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;width:100%;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
  table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;display:block;}
  a{color:#061866;}
  a[x-apple-data-detectors]{color:inherit !important;text-decoration:none !important;}
  .btn:hover{background-color:#FFFFFF !important;}
  @media screen and (max-width:620px){
    .conteneur{width:100% !important;}
    .pad{padding-left:20px !important;padding-right:20px !important;}
    .chiffre{font-size:56px !important;line-height:60px !important;}
    .titre{font-size:24px !important;line-height:30px !important;}
    .btn-table{width:100% !important;}
    .btn-cell, .btn{display:block !important;width:100% !important;box-sizing:border-box !important;text-align:center !important;}
  }
  @media (prefers-color-scheme:dark){
    .fond-clair{background-color:#000E38 !important;}
    .carte{background-color:#0B1A4F !important;}
    .bref{background-color:#061866 !important;}
    .texte-fonce{color:#FFFFFF !important;}
    .texte-doux{color:#C9CEDF !important;}
  }
</style>
</head>
<body class="fond-clair" style="margin:0;padding:0;background-color:#F5F3F1;">

<!-- Preheader : visible dans la boîte de réception, caché dans le mail -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F5F3F1;opacity:0;">
  $preheader
  &#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="fond-clair" style="background-color:#F5F3F1;">
<tr><td align="center" style="padding:0;">

  <!-- Lien navigateur -->
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="conteneur" style="width:600px;max-width:600px;">
    <tr><td class="pad texte-doux" align="right" style="padding:14px 32px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;color:#53565A;">
      <a href="{{ mirror }}" style="color:#53565A;text-decoration:underline;">$lien_navigateur</a>
    </td></tr>
  </table>

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="conteneur" style="width:600px;max-width:600px;">

    <!-- 1. En-tête : logo -->
    <tr><td class="pad" style="background-color:#061866;padding:28px 40px 0 40px;">
      <a href="$lien_logo" target="_blank" style="text-decoration:none;">
        <img src="$assets/logo-truckfly-blanc.png" width="180" height="45" alt="Michelin Truckfly" style="width:180px;height:45px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#FFFFFF;">
      </a>
    </td></tr>

    <!-- 2. Accroche : un chiffre, une phrase -->
    <tr><td class="pad" style="background-color:#061866;padding:36px 40px 40px 40px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;">
      <p style="margin:0 0 6px 0;font-size:14px;line-height:20px;font-weight:bold;color:#FFFFFF;">$surtitre</p>
      <p class="chiffre" style="margin:0;font-size:72px;line-height:76px;font-weight:bold;color:#FFFF1A;">$chiffre</p>
      <p style="margin:12px 0 0 0;font-size:18px;line-height:27px;color:#FFFFFF;">$accroche</p>
    </td></tr>

    <!-- 3. Sujet principal -->
    <tr><td class="pad carte" style="background-color:#FFFFFF;padding:40px 40px 8px 40px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;">
      <p class="texte-fonce" style="margin:0 0 20px 0;font-size:16px;line-height:24px;color:#000000;">$salutation</p>
      <h1 class="titre texte-fonce" style="margin:0 0 20px 0;font-size:28px;line-height:34px;font-weight:bold;color:#061866;">$titre</h1>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
$points
      </table>
    </td></tr>

    <!-- 4. En bref -->
    <tr><td class="pad carte" style="background-color:#FFFFFF;padding:24px 40px 40px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td class="bref" style="background-color:#F5F3F1;border-radius:12px;padding:28px 28px 12px 28px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;">
          <h2 class="texte-fonce" style="margin:0 0 16px 0;font-size:20px;line-height:26px;font-weight:bold;color:#061866;">$titre_bref</h2>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
$brefs
          </table>
        </td></tr>
      </table>
    </td></tr>

    <!-- 5. Appel à l'action : une seule action -->
    <tr><td class="pad" align="center" style="background-color:#061866;padding:40px 40px 44px 40px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;">
      <p style="margin:0 0 24px 0;font-size:20px;line-height:28px;font-weight:bold;color:#FFFFFF;">$cta_intro</p>
      <table role="presentation" class="btn-table" cellpadding="0" cellspacing="0" border="0" align="center">
        <tr><td class="btn-cell" align="center" style="border-radius:28px;background-color:#FFFF1A;">
          <!--[if mso]>
          <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="$lien_cta" style="height:56px;v-text-anchor:middle;width:340px;" arcsize="50%" stroke="f" fillcolor="#FFFF1A">
            <w:anchorlock/>
            <center style="color:#061866;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;">$cta</center>
          </v:roundrect>
          <![endif]-->
          <!--[if !mso]><!-- -->
          <a class="btn" href="$lien_cta" target="_blank" style="display:inline-block;padding:17px 36px;border-radius:28px;background-color:#FFFF1A;font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:18px;line-height:22px;font-weight:bold;color:#061866;text-decoration:none;">$cta&nbsp;&rarr;</a>
          <!--<![endif]-->
        </td></tr>
      </table>
      <p style="margin:24px 0 0 0;font-size:16px;line-height:24px;color:#FFFFFF;">$signature</p>
    </td></tr>

    <!-- 6. Pied de page -->
    <tr><td class="pad texte-doux" align="center" style="padding:28px 40px 40px 40px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#53565A;">
      <p style="margin:0 0 8px 0;">$raison</p>
      <p style="margin:0 0 8px 0;"><a href="{{ unsubscribe }}" style="color:#53565A;text-decoration:underline;">$desinscription</a></p>
      <p style="margin:0;">$adresse</p>
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
