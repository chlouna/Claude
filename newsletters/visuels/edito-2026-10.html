<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>

html,body{margin:0}
.v{width:1200px;height:600px;position:relative;overflow:hidden;background:#061866;font-family:Inter,sans-serif;color:#fff}
.halo{position:absolute;right:-180px;top:-220px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#1B2F8A 0%,#061866 70%)}
.logo{position:absolute;left:72px;top:60px;width:190px}
.label{position:absolute;left:72px;top:110px;font-size:22px;font-weight:600;color:#FFFF1A}

.sous{position:absolute;left:72px;top:318px;font-size:28px;line-height:38px;width:520px;color:#E6E9F5}
.pictos{position:absolute;left:72px;top:416px;display:flex;gap:26px}
.picto{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:#fff}
.rond{width:46px;height:46px;border-radius:50%;background:#0F2479;border:2px solid #2A3E9A;display:flex;align-items:center;justify-content:center}
.route{position:absolute;left:0;right:0;top:492px;bottom:0;background:#000E38;border-top:6px solid #2A3E9A}
.tiret{position:absolute;top:548px;height:7px;width:70px;border-radius:3px;background:#FFFF1A}
.scene{position:absolute;right:0;bottom:0;width:640px;height:600px}
