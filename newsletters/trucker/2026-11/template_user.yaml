                  content: '<p><span style="color: rgb(0, 0, 0);">Cada día, miles de camioneros <strong>circulan, comparten y dan vida a la comunidad Michelin Truckfly.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Con noviembre, el invierno llega a la carretera: nuevas obligaciones en montaña, carreteras resbaladizas, condiciones que cambian rápido… Razones de sobra para <strong>preparar bien tus rutas y compartir la información correcta.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Este mes descubre <strong>qué pasa a ser obligatorio en Francia a partir del 1 de noviembre y cómo ayudar a otros camioneros frente a los peligros del invierno. Sin olvidar al mejor colaborador de octubre… ¡y nuestros consejos para quitarle el puesto!</strong></span></p>'
