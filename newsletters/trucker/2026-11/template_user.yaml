                  content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">¿Lo sabías?</span></strong><span style="color: rgb(249, 250, 252);">&nbsp;</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">¿Circulas por Francia? Desde el <strong>domingo 1 de noviembre hasta el 31 de marzo</strong>, la <strong>Loi Montagne</strong> (la ley francesa de montaña) se aplica en algunos municipios de montaña de Francia. Están señalizados con un panel a la entrada de la zona.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Y los camiones también están afectados:</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Camión con remolque o semirremolque</strong>: cadenas obligatorias a bordo para equipar <strong>al menos dos ruedas motrices</strong>, aunque lleves neumáticos de invierno.</li><li style="color: rgb(249, 250, 252);"><strong>Camión sin remolque</strong>: a elegir, <strong>cadenas</strong> o <strong>neumáticos de invierno</strong>.</li></ul><p><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Ojo con los neumáticos:</strong> solo cuentan como equipamiento de invierno los neumáticos con el <strong>símbolo 3PMSF</strong> (la montaña de tres picos con un copo de nieve). Los demás neumáticos «de nieve» no bastan por sí solos: también necesitas cadenas.</span></p><p class="default"><br></p><p class="default"><span style="color:rgb(249, 250, 252)"><strong>¡Los camiones extranjeros también están afectados!</strong> De momento no hay multas. Pero sin equipamiento, las fuerzas del orden pueden impedirte el acceso a la zona y tu seguro puede reducir o rechazar la indemnización en caso de accidente.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Tu checklist antes de salir:</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Revisa tus neumáticos</strong>: ¿llevan el símbolo 3PMSF?</li><li style="color: rgb(249, 250, 252);"><strong>Comprueba tus cadenas</strong>: están en el camión, en buen estado, y sabes montarlas.</li></ul>'
