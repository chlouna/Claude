                  content: '<p><span style="color: rgb(0, 0, 0);">Chaque jour, des milliers de conducteurs <strong>roulent, partagent et font vivre la communauté Michelin Truckfly.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Avec novembre, l’hiver s’installe sur la route : nouvelles obligations en montagne, routes glissantes, conditions qui changent vite… Autant de raisons de bien <strong>préparer tes trajets et de partager les bonnes infos.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Ce mois-ci, découvre <strong>ce qui devient obligatoire dès le 1er novembre et comment aider les autres conducteurs face aux dangers de l’hiver. Sans oublier le top contributeur d’octobre… et nos astuces pour prendre sa place !</strong></span></p>'
