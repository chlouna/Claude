                  content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Strade trafficate, ristoranti chiusi, parcheggi pieni: durante le feste, trovare una buona sosta richiede tempo.&nbsp;</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Ecco come ti aiuta Michelin Truckfly prima, durante e dopo le feste.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Prima</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Prepara le tue soste lungo il percorso. Guarda tutto: le foto, le recensioni e ora anche i like. I contributi con più like ti indicano i posti più affidabili.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Durante</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Leggi le recensioni più recenti per sapere cosa è aperto (docce, ristorante, negozio) e se il parcheggio è pieno.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Dopo</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Lascia una recensione, aggiungi una foto o metti like a un contributo utile: aiuti il collega che arriva dopo, e ogni azione ti fa guadagnare 1 punto.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 14px;">Da ricordare: in Italia i mezzi oltre 7,5 t non possono circolare fuori dai centri abitati, dalle 9 alle 22, domenica 6, martedì 8, domenica 13, domenica 20, venerdì 25, sabato 26 e domenica 27 dicembre.</span></p>'
