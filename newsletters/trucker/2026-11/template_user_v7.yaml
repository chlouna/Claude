                      width: 100%
                  content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Carreteras cargadas, restaurantes cerrados, aparcamientos llenos: en las fiestas, encontrar una buena parada lleva tiempo.&nbsp;</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Así te ayuda Michelin Truckfly antes, durante y después de las fiestas.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Antes</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Prepara tus paradas en tu ruta. Míralo todo: las fotos, las opiniones y ahora los me gusta. Las aportaciones con más me gusta te indican los lugares más fiables.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Durante</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Lee las opiniones más recientes para saber qué está abierto (duchas, restaurante, tienda) y si el aparcamiento está lleno.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Después</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Deja una opinión, añade una foto o da me gusta a una aportación útil: ayudas al compañero que viene detrás, y cada acción te da 1 punto.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 14px;">¿Vas a Francia? Allí los camiones de más de 7,5 t no pueden circular del jueves 24 de diciembre a las 22 h al viernes 25 a las 22 h, ni del jueves 31 de diciembre a las 22 h al viernes 1 de enero a las 22 h.</span></p>'
