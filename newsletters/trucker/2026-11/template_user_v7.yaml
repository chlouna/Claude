                  content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Drukke wegen, gesloten restaurants, volle parkings: tijdens de feestdagen kost een goede stop tijd.&nbsp;</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Zo helpt Michelin Truckfly je voor, tijdens en na de feestdagen.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Voor</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Plan je stops langs je route. Bekijk alles: foto’s, reviews en nu ook likes. De meest gelikete bijdragen wijzen je de meest betrouwbare plekken aan.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Tijdens</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Lees de meest recente reviews om te zien wat er open is (douches, restaurant, winkel) en hoe vol de parking is.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Na</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Laat een review achter, voeg een foto toe of like een nuttige bijdrage: zo help je de volgende chauffeur, en elke actie levert je 1 punt op.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 14px;">Rij je naar Frankrijk? Daar mogen vrachtwagens boven 7,5 t niet rijden op 25 december en 1 januari.</span></p>'
