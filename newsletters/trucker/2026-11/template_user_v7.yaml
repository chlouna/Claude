                  content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Routes chargées, restos fermés, parkings pleins : pendant les fêtes, trouver un bon arrêt prend du temps.&nbsp;</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Voici comment Michelin Truckfly t’aide avant, pendant et après les fêtes.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Avant</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Prépare tes arrêts sur ta route. Regarde tout&nbsp;: les photos, les avis et maintenant les j’aime. Les contributions les plus aimées t’indiquent les lieux les plus fiables.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Pendant</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Lis les avis les plus récents pour savoir ce qui est ouvert (douches, resto, boutique) et si le parking est plein.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Après</strong></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Laisse un avis, ajoute une photo ou like une contribution utile&nbsp;: tu aides le collègue suivant, et chaque action te rapporte 1&nbsp;point.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 14px;">À noter&nbsp;: en France, les poids lourds de plus de 7,5&nbsp;t ne roulent pas du jeudi 24 décembre 22&nbsp;h au vendredi 25 décembre 22&nbsp;h, ni du jeudi 31 décembre 22&nbsp;h au vendredi 1er janvier 22&nbsp;h.</span></p>'
