                      width: 100%
                  content: '<p><span style="color: rgb(0, 0, 0);">Every day, thousands of drivers <strong>drive, share and bring the Michelin Truckfly community to life.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">December is coming, and with it the festive season: public holidays, busy roads, last minute deliveries… All good reasons to <strong>plan your trips well.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">This month, find out <strong>the days you won’t be able to drive over the holidays, how to activate your promo code in 30 seconds, and October’s top contributor… with our tips to take their place!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>And don’t miss our Black Friday offer: it starts tomorrow!</strong></span></p>'
