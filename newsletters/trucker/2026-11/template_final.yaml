          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Sulla strada, ci si fida di chi condivide le info giuste. <strong>Un autista con tanti punti contributo è un autista affidabile</strong>: quando segnala un pericolo o valuta una sosta, la community sa di poter contare su di lui.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">E la regola è semplice: <strong>ogni azione vale 1 punto.</strong> Basta una pausa caffè per guadagnarne diversi!</span></p>'
