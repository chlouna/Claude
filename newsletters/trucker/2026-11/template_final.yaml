          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>¿Lo sabías?</strong></span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>El 86% de los camioneros</strong> usa un GPS para turismos, que puede ponerlos en peligro.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Con las carreteras cargadas y las restricciones de las fiestas, no es momento de equivocarse de ruta. El GPS Michelin Truckfly tiene en cuenta todas las limitaciones de tu camión:</span></p>'
        - id: f24509cb-8679-4425-9d4b-ba0671fc4e6a
