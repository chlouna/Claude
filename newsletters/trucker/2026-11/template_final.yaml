              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>Le savais-tu&nbsp;?</strong></span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>86&nbsp;% des conducteurs poids lourds</strong> utilisent un GPS pour véhicules légers, qui peut les mettre en danger.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Avec les routes chargées et les interdictions des fêtes, ce n’est pas le moment de se tromper de route. Le GPS Michelin Truckfly prend en compte toutes les contraintes de ton camion&nbsp;:</span></p>'
        - id: c8a93088-58d0-4e2e-afb0-94301d17a37c
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 15px
              padding-top: 15px
              width: 100%
          content: "<!-- GPS POIDS LOURDS : AVANTAGES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Une navigation poids lourds</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Gabarit, poids, routes autorisées, restrictions ADR&nbsp;: ton itinéraire est adapté à ton camion.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Les alertes de la communauté</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Zones de contrôle, accidents, dangers&nbsp;: la plus grande communauté poids lourds d’Europe te prévient en temps réel. Et le trafic en direct t’aide à éviter les bouchons.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Nouveau&nbsp;: l’alerte péage</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Une alerte te prévient à l’approche d’un péage&nbsp;: tu as le temps de te placer sur la bonne voie et de sortir ton badge.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">+135&nbsp;000 établissements poids lourds</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Restaurants, parkings gratuits ou sécurisés, stations-service&nbsp;: tu sais toujours où t’arrêter.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Pas de pub au lancement</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Tu ouvres l’appli, tu roules.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:6px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#FFFFFF;\"><strong>Ne tombe plus dans le panneau&nbsp;: teste le GPS 14&nbsp;jours gratuitement.</strong> Et demain, surveille ta boîte mail&nbsp;!</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Source&nbsp;: Michelin Truckfly</p>\n  </td></tr>\n</table>"
