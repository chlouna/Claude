          content: <h2 class="default-heading2"><span style="color:rgb(255, 255, 255)">3. De feestdagen met een vrachtwagen-GPS</span></h2><p><br></p>
        - id: 66ba3b97-d28c-4295-8c43-84d8c954305e
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>Wist je dat?</strong></span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>86% van de vrachtwagenchauffeurs</strong> gebruikt een GPS voor personenauto’s, en dat kan gevaarlijk zijn.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Met drukke wegen en rijverboden tijdens de feestdagen is dit niet het moment om verkeerd te rijden. De Michelin Truckfly GPS houdt rekening met alle beperkingen van je truck:</span></p>'
        - id: 2a2a679e-d0ba-4fa8-aa09-b6f5215828f3
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 15px
              padding-top: 15px
              width: 100%
          content: "<!-- GPS POIDS LOURDS : AVANTAGES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Navigatie voor vrachtwagens</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Afmetingen, gewicht, toegestane wegen, ADR-beperkingen: je route is aangepast aan je truck.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Meldingen van de community</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Controles, ongevallen, gevaren: de grootste vrachtwagencommunity van Europa waarschuwt je in realtime. En live verkeer helpt je files te vermijden.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Nieuw: de tolwaarschuwing</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Een melding waarschuwt je bij het naderen van een tolpoort: je hebt tijd om de juiste rijstrook te kiezen en je tolbadge klaar te houden.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Meer dan 135.000 locaties voor vrachtwagens</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Restaurants, gratis of beveiligde parkings, tankstations: je weet altijd waar je kunt stoppen.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Geen reclame bij het opstarten</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">App open en rijden maar.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:6px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#FFFFFF;\"><strong>Laat je niet meer verrassen: probeer de GPS 14 dagen gratis.</strong> En hou morgen je mailbox in de gaten!</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Bron: Michelin Truckfly</p>\n  </td></tr>\n</table>"
