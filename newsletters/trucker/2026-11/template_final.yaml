          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Chains, winter tyres: are you compliant?</span></h2><p><br></p>'
        - id: 97b9fd74-b8d7-4d47-954f-e8745f27df37
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Did you know?</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Driving in France? <strong>Since 1 November and until 31 March</strong>, the <strong>Loi Montagne</strong> (the French mountain law) applies in some mountain areas of France. They are marked by a sign at the entrance to the zone.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">And HGVs are concerned:</span></p><p class="default"><br></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>HGV with trailer or semi-trailer</strong>: chains mandatory on board to fit <strong>at least two drive wheels</strong>, even if you run on winter tyres.</li><li style="color: rgb(249, 250, 252);"><strong>HGV without trailer</strong>: your choice, <strong>chains</strong> or <strong>winter tyres</strong>.</li></ul><p><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Watch your tyres:</strong> only tyres with the <strong>3PMSF symbol</strong> (the three-peak mountain with a snowflake) count as winter equipment. Other “snow” tyres are not enough on their own: you also need chains.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Foreign trucks are concerned too!</strong> Without equipment, the police can refuse you access to the zone and your insurer can reduce or refuse compensation in the event of an accident.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Your checklist before you set off:</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Check your tyres</strong>: is the 3PMSF symbol there?</li><li style="color: rgb(249, 250, 252);"><strong>Check your chains</strong>: they are in the truck, in good condition, and you know how to fit them.</li></ul>'
