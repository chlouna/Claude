              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>Did you know?</strong></span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>86% of HGV drivers</strong> use a GPS made for cars, which can put them in danger.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">With busy roads and holiday driving bans, this is no time to take a wrong turn. The Michelin Truckfly GPS takes every constraint of your truck into account:</span></p>'
        - id: 6becb0d8-bafc-44fe-9340-167c06ca0e42
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 15px
              padding-top: 15px
              width: 100%
          content: "<!-- GPS POIDS LOURDS : AVANTAGES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">HGV navigation</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Size, weight, permitted roads, ADR restrictions: your route is adapted to your truck.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Community alerts</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Police checks, accidents, hazards: Europe’s largest HGV community warns you in real time. And live traffic helps you avoid jams.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">New: the toll alert</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">An alert warns you as you approach a toll: you have time to get into the right lane and get your tag ready.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">135,000+ HGV-friendly places</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Restaurants, free or secure parking, fuel stations: you always know where to stop.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">No ads at launch</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Open the app and drive.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:6px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#FFFFFF;\"><strong>Never get caught out again: try the GPS free for 14 days.</strong> And tomorrow, keep an eye on your inbox!</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Source: Michelin Truckfly</p>\n  </td></tr>\n</table>"
