          content: <h2 class="default-heading2"><span style="color:rgb(255, 255, 255)">3. The festive season with a truck GPS</span></h2><p><br></p>
        - id: 396f3776-e84f-40e0-92b5-474d4ea69866
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
