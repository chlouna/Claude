          content: <h2 class="default-heading2"><span style="color:rgb(255, 255, 255)">3. Les fêtes en GPS poids lourds</span></h2><p><br></p>
        - id: 7c679fa5-e076-4f3e-b214-f0700cc7291c
          stylable: false
