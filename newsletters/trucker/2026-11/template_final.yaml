              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">¿Lo sabías?</span></strong></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">En diciembre, los festivos se suman a los fines de semana. En Francia e Italia, eso significa más días en los que los camiones de más de 7,5 t no pueden circular. Buen reflejo: <strong>planifica ya tus entregas y tus pausas.</strong></span></p><p class="default"><br></p>'
        - id: 35a534c1-a18e-45a4-b20e-24888a0ec040
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 10px
              padding-top: 5px
              width: 100%
          content: "<!-- RÉCAP INTERDICTIONS FÊTES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">España</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• No hay prohibición general, sino restricciones en tramos concretos. Cataluña, País Vasco y Navarra tienen sus propias normas.</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Francia<span style=\"font-weight:400;color:#4A4A4A;\"> · más de 7,5 t, toda la red</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Del jueves 24 de diciembre a las 22 h al viernes 25 a las 22 h</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Del jueves 31 de diciembre a las 22 h al viernes 1 de enero a las 22 h</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Y cada fin de semana, del sábado a las 22 h al domingo a las 22 h</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Italia<span style=\"font-weight:400;color:#4A4A4A;\"> · más de 7,5 t, fuera de poblado, de 9 h a 22 h</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Domingos 6, 13, 20 y 27 de diciembre</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Martes 8, viernes 25 y sábado 26 de diciembre</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:4px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#F9FAFC;\">Pueden añadirse restricciones locales: compruébalo antes de salir. Y en Michelin Truckfly, localiza con antelación los aparcamientos para camiones en tu ruta.</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Fuentes: Bison Futé · Ministerio de Transportes italiano · DGT</p>\n  </td></tr>\n</table>"
