              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default" id="isPasted"><strong><span style="color: rgb(249, 250, 252);">Le savais-tu ?</span></strong><span style="color: rgb(249, 250, 252);">&nbsp;</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Depuis le 1er novembre et jusqu’au 31 mars</strong>, la <strong>Loi Montagne</strong> s’applique dans certaines communes de montagne en France. Elles sont signalées par un panneau à l’entrée de la zone.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);">Et les poids lourds sont concernés :</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>PL avec remorque ou semi-remorque</strong> : chaînes obligatoires dans le camion pour équiper <strong>au moins deux roues motrices</strong>, même si tu roules en pneus hiver.</li><li style="color: rgb(249, 250, 252);"><strong>PL sans remorque</strong> : au choix, <strong>chaînes</strong> ou <strong>pneus hiver</strong>.</li></ul><p><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Attention aux pneus :</strong> seuls les pneus marqués du <strong>symbole 3PMSF</strong> (la montagne à trois pics avec un flocon) comptent comme équipement hiver. Les autres pneus « neige » ne suffisent pas seuls : il te faut aussi des chaînes.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Ta checklist avant de partir :</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Vérifie tes pneus</strong> : le symbole 3PMSF est-il bien présent ?</li><li style="color: rgb(249, 250, 252);"><strong>Contrôle tes chaînes</strong> : elles sont dans le camion, en bon état, et tu sais les monter.</li></ul>'
