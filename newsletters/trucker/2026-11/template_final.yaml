              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>Lo sapevi?</strong></span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;"><strong>L’86% degli autisti di mezzi pesanti</strong> usa un GPS per auto, che può metterli in pericolo.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Con strade trafficate e divieti delle feste, non è il momento di sbagliare strada. Il GPS Michelin Truckfly tiene conto di tutti i vincoli del tuo camion:</span></p>'
        - id: 6c7afbe9-211d-4397-8f2b-bf98d0530851
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 15px
              padding-top: 15px
              width: 100%
          content: "<!-- GPS POIDS LOURDS : AVANTAGES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Navigazione per mezzi pesanti</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Sagoma, peso, strade consentite, restrizioni ADR: il percorso è adatto al tuo camion.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Le segnalazioni della community</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Controlli, incidenti, pericoli: la più grande community di camionisti d’Europa ti avvisa in tempo reale. E il traffico in diretta ti aiuta a evitare le code.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Novità: l’avviso casello</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Un avviso ti segnala l’avvicinarsi di un casello: hai il tempo di metterti sulla corsia giusta e preparare il telepedaggio.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Oltre 135.000 strutture per mezzi pesanti</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Ristoranti, parcheggi gratuiti o sorvegliati, distributori: sai sempre dove fermarti.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Niente pubblicità all’avvio</p>\n    <p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">Apri l’app e parti.</p>\n  </td></tr>\n  <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:6px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#FFFFFF;\"><strong>Non farti più cogliere di sorpresa: prova il GPS gratis per 14 giorni.</strong> E domani, tieni d’occhio la tua casella email!</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Fonte: Michelin Truckfly</p>\n  </td></tr>\n</table>"
