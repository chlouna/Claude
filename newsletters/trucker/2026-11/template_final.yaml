          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Feestdagen: de dagen dat je niet mag rijden</span></h2><p><br></p>'
        - id: 6a1e0e4e-3f7b-4652-8c0b-b884d50ac2dc
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
