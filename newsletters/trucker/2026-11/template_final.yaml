          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Feste di fine anno: i giorni in cui non puoi circolare</span></h2><p><br></p>'
        - id: 822272fc-31da-4be2-a9db-3db7cc878d4b
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">Lo sapevi?</span></strong></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">A dicembre i giorni festivi si aggiungono ai fine settimana. In Francia e in Italia significa più giorni in cui i camion oltre 7,5 t non possono circolare. Il riflesso giusto: <strong>pianifica fin da ora consegne e pause.</strong></span></p><p class="default"><br></p>'
        - id: 33b7546d-0b21-4dce-975c-a9cd21400538
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 10px
              padding-top: 5px
              width: 100%
          content: "<!-- RÉCAP INTERDICTIONS FÊTES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Italia<span style=\"font-weight:400;color:#4A4A4A;\"> · oltre 7,5 t, fuori dai centri abitati, dalle 9 alle 22</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Domeniche 6, 13, 20 e 27 dicembre</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Martedì 8, venerdì 25 e sabato 26 dicembre</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Francia<span style=\"font-weight:400;color:#4A4A4A;\"> · oltre 7,5 t, su tutta la rete</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Da giovedì 24 dicembre ore 22 a venerdì 25 ore 22</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Da giovedì 31 dicembre ore 22 a venerdì 1° gennaio ore 22</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• E ogni fine settimana, dal sabato ore 22 alla domenica ore 22</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Spagna</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Nessun divieto generale, ma restrizioni su alcuni tratti. Catalogna, Paesi Baschi e Navarra hanno regole proprie.</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:4px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#F9FAFC;\">Possono aggiungersi divieti locali: verifica prima di partire. E su Michelin Truckfly, individua in anticipo i parcheggi per camion lungo il percorso.</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Fonti: Ministero delle Infrastrutture e dei Trasporti · Bison Futé · DGT</p>\n  </td></tr>\n</table>"
