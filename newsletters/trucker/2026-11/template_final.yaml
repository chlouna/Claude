              removeMargin: true
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Kettingen, winterbanden: ben jij in orde?</span></h2><p><br></p>'
        - id: 5c2b3e00-76b8-46d4-8285-804b46d11e5e
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Wist je dat?</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Rij je in Frankrijk? <strong>Sinds 1 november en tot 31 maart</strong> geldt de <strong>Loi Montagne</strong> (de Franse bergwet) in bepaalde berggemeenten in Frankrijk. Ze worden aangegeven met een bord bij het begin van de zone.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">En vrachtwagens vallen er ook onder:</span></p><p class="default"><br></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Vrachtwagen met aanhanger of oplegger</strong>: sneeuwkettingen verplicht aan boord om <strong>minstens twee aangedreven wielen</strong> uit te rusten, ook als je op winterbanden rijdt.</li><li style="color: rgb(249, 250, 252);"><strong>Vrachtwagen zonder aanhanger</strong>: naar keuze <strong>sneeuwkettingen</strong> of <strong>winterbanden</strong>.</li></ul><p><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Let op je banden:</strong> alleen banden met het <strong>3PMSF-symbool</strong> (de berg met drie toppen en een sneeuwvlok) tellen als winteruitrusting. Andere ‘sneeuwbanden’ zijn alleen niet genoeg: je hebt ook kettingen nodig.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Ook buitenlandse vrachtwagens vallen eronder!</strong> Zonder uitrusting kan de politie je de toegang tot de zone weigeren en kan je verzekeraar de schadevergoeding verlagen of weigeren bij een ongeval.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Jouw checklist voor vertrek:</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Controleer je banden</strong>: staat het 3PMSF-symbool erop?</li><li style="color: rgb(249, 250, 252);"><strong>Controleer je kettingen</strong>: ze liggen in de truck, zijn in goede staat en je weet hoe je ze monteert.</li></ul>'
