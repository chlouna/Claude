              width: 100%
          content: '<p><span style="color: rgb(0, 0, 0);">Elke dag zijn duizenden chauffeurs <strong>onderweg, delen ze info en houden ze de Michelin Truckfly community levend.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Met november heeft de winter zijn intrede gedaan op de weg: nieuwe regels in de bergen, gladde wegen, snel wisselende omstandigheden… Genoeg redenen om <strong>je ritten goed voor te bereiden en de juiste info te delen.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Deze maand ontdek je <strong>wat er sinds 1 november verplicht is in Frankrijk en hoe je andere chauffeurs helpt bij wintergevaren. En natuurlijk de topbijdrager van oktober… en onze tips om zijn plek in te nemen!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>En mis onze Black Friday-actie niet: morgen gaat hij van start!</strong></span></p>'
