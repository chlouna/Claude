          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1.&nbsp;<span style="color:rgb(255, 255, 255)">Cadenas, neumáticos de invierno: ¿estás en regla?</span></span></h2><p><br></p>'
        - id: 768ff955-c6b5-4e46-ac82-6cde682c04d9
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
