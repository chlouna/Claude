              padding-top: 15px
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><span style="color: rgb(0, 0, 0);">Every day, thousands of drivers <strong>drive, share and bring the Michelin Truckfly community to life.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">With November, winter has settled on the road: new rules in the mountains, slippery roads, conditions that change fast… All good reasons to <strong>plan your trips well and share the right info.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">This month, find out <strong>what has been mandatory in France since 1 November and how to help other drivers face winter hazards. Not forgetting October’s top contributor… and our tips to take their place!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>And don’t miss our Black Friday offer: it starts tomorrow!</strong></span></p>'
