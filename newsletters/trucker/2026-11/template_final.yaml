              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Fêtes de fin d’année&nbsp;: les jours où tu ne roules pas</span></h2><p><br></p>'
        - id: 8e2e5103-92fd-4dd7-9070-20daaf7fa08f
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Le savais-tu&nbsp;?</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">En décembre, les jours fériés s’ajoutent aux week-ends. En France et en Italie, ça fait plus de jours où les camions de plus de 7,5&nbsp;t n’ont pas le droit de rouler. Le bon réflexe&nbsp;: <strong>planifier tes livraisons et tes pauses dès maintenant.</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>France</strong> (plus de 7,5&nbsp;t, tout le réseau)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Du jeudi 24 décembre 22&nbsp;h au vendredi 25 décembre 22&nbsp;h</li><li style="color: rgb(249, 250, 252);">Du jeudi 31 décembre 22&nbsp;h au vendredi 1er janvier 22&nbsp;h</li><li style="color: rgb(249, 250, 252);">Et chaque week-end, du samedi 22&nbsp;h au dimanche 22&nbsp;h</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Italie</strong> (plus de 7,5&nbsp;t, hors agglomérations, de 9&nbsp;h à 22&nbsp;h)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Dimanches 6, 13, 20 et 27 décembre</li><li style="color: rgb(249, 250, 252);">Mardi 8, vendredi 25 et samedi 26 décembre</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Espagne</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Pas d’interdiction générale, mais des restrictions sur certains tronçons. La Catalogne, le Pays basque et la Navarre ont leurs propres règles.</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Des interdictions locales peuvent s’ajouter&nbsp;: vérifie avant de partir. Et sur Michelin Truckfly, repère à l’avance les parkings poids lourds sur ta route.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 11px;">Sources&nbsp;: Bison Futé · Ministère italien des Transports · DGT</span></p>'
