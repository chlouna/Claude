          content: '<!--StartFragment--><h2 class="default-heading2" id="isPasted"><span style="color:rgb(255, 255, 255)">3. <span style="color: rgb(255, 255, 255);">Deviens le meilleur contributeur du mois&nbsp;</span></span></h2><p><br></p>'
