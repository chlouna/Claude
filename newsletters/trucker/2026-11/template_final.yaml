          content: '<p><span style="color: rgb(0, 0, 0);">Ogni giorno, migliaia di autisti <strong>viaggiano, condividono e fanno vivere la community Michelin Truckfly.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Con novembre, l’inverno arriva sulla strada: nuovi obblighi in montagna, strade scivolose, condizioni che cambiano in fretta… Tanti buoni motivi per <strong>preparare bene i tuoi viaggi e condividere le info giuste.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Questo mese scopri <strong>cosa è obbligatorio in Francia dal 1° novembre e come aiutare gli altri autisti contro i pericoli dell’inverno. Senza dimenticare il top contributore di ottobre… e i nostri consigli per prendere il suo posto!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>E non perderti la nostra offerta Black Friday: inizia domani!</strong></span></p>'
