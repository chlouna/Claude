              text-valign: top
              valign: top
              width: 100%
          content: '<p><br></p><h2 class="default-heading2"><span style="color: rgb(255, 255, 255);">1. Fêtes de fin d’année&nbsp;: les jours où tu ne roules pas</span></h2><p><br></p>'
        - id: 8e2e5103-92fd-4dd7-9070-20daaf7fa08f
          stylable: false
          title: Paragraph
          type: text
          layout:
            320px:
              width: 100%
            default:
              align: left
              margin-bottom: 15px
              padding-bottom: 0px
              padding-left: 0px
              padding-right: 0px
              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">Le savais-tu&nbsp;?</span></strong></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">En décembre, les jours fériés s’ajoutent aux week-ends. En France et en Italie, ça fait plus de jours où les camions de plus de 7,5&nbsp;t n’ont pas le droit de rouler. Le bon réflexe&nbsp;: <strong>planifier tes livraisons et tes pauses dès maintenant.</strong></span></p><p class="default"><br></p>'
        - id: 01558eaa-624d-4325-a47e-91f858e845eb
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 10px
              padding-top: 5px
              width: 100%
          content: "<!-- RÉCAP INTERDICTIONS FÊTES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">France<span style=\"font-weight:400;color:#4A4A4A;\"> · plus de 7,5&nbsp;t, tout le réseau</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Du jeudi 24 décembre 22&nbsp;h au vendredi 25 décembre 22&nbsp;h</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Du jeudi 31 décembre 22&nbsp;h au vendredi 1er janvier 22&nbsp;h</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Et chaque week-end, du samedi 22&nbsp;h au dimanche 22&nbsp;h</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Italie<span style=\"font-weight:400;color:#4A4A4A;\"> · plus de 7,5&nbsp;t, hors agglomérations, de 9&nbsp;h à 22&nbsp;h</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Dimanches 6, 13, 20 et 27 décembre</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Mardi 8, vendredi 25 et samedi 26 décembre</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Espagne</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Pas d’interdiction générale, mais des restrictions sur certains tronçons. La Catalogne, le Pays basque et la Navarre ont leurs propres règles.</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:4px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#F9FAFC;\">Des interdictions locales peuvent s’ajouter&nbsp;: vérifie avant de partir. Et sur Michelin Truckfly, repère à l’avance les parkings poids lourds sur ta route.</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Sources&nbsp;: Bison Futé · Ministère italien des Transports · DGT</p>\n  </td></tr>\n</table>"
