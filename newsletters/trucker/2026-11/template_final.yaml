          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Lo sapevi?</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">A dicembre i giorni festivi si aggiungono ai fine settimana. In Francia e in Italia significa più giorni in cui i camion oltre 7,5 t non possono circolare. Il riflesso giusto: <strong>pianifica fin da ora consegne e pause.</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Italia</strong> (oltre 7,5 t, fuori dai centri abitati, dalle 9 alle 22)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Domeniche 6, 13, 20 e 27 dicembre</li><li style="color: rgb(249, 250, 252);">Martedì 8, venerdì 25 e sabato 26 dicembre</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Francia</strong> (oltre 7,5 t, su tutta la rete)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Da giovedì 24 dicembre ore 22 a venerdì 25 ore 22</li><li style="color: rgb(249, 250, 252);">Da giovedì 31 dicembre ore 22 a venerdì 1° gennaio ore 22</li><li style="color: rgb(249, 250, 252);">E ogni fine settimana, dal sabato ore 22 alla domenica ore 22</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Spagna</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Nessun divieto generale, ma restrizioni su alcuni tratti. Catalogna, Paesi Baschi e Navarra hanno regole proprie.</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Possono aggiungersi divieti locali: verifica prima di partire. E su Michelin Truckfly, individua in anticipo i parcheggi per camion lungo il percorso.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 11px;">Fonti: Ministero delle Infrastrutture e dei Trasporti · Bison Futé · DGT</span></p>'
