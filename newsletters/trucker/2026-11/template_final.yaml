          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">Lo sapevi?</span></strong><span style="color: rgb(249, 250, 252);">&nbsp;</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Viaggi in Francia? <strong>Dal 1° novembre e fino al 31 marzo</strong>, la <strong>Loi Montagne</strong> (la legge francese sulla montagna) si applica in alcuni comuni di montagna in Francia. Sono segnalati da un cartello all&#39;ingresso della zona.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);">E i mezzi pesanti sono interessati:</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Camion con rimorchio o semirimorchio</strong>: catene obbligatorie a bordo per equipaggiare <strong>almeno due ruote motrici</strong>, anche se monti pneumatici invernali.</li><li style="color: rgb(249, 250, 252);"><strong>Camion senza rimorchio</strong>: a scelta, <strong>catene</strong> o <strong>pneumatici invernali</strong>.</li></ul><p><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Attenzione ai pneumatici:</strong> valgono come equipaggiamento invernale solo i pneumatici con il <strong>simbolo 3PMSF</strong> (la montagna a tre punte con il fiocco di neve). Gli altri pneumatici «da neve» da soli non bastano: servono anche le catene.</span></p><p class="default"><br></p><p><strong id="isPasted"><span style="color: rgb(255, 255, 255);">Anche i camion stranieri sono interessati!</span></strong><span style="color: rgb(255, 255, 255);">&nbsp;Per ora non sono previste multe. Ma senza equipaggiamento le forze dell’ordine possono vietarti l’accesso alla zona e la tua assicurazione può ridurre o rifiutare il risarcimento in caso di incidente.</span></p><p class="default"><span style="color: rgb(249, 250, 252);"><br></span></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>La tua checklist prima di partire:</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);"><strong>Controlla i pneumatici</strong>: c&#39;è il simbolo 3PMSF?</li><li style="color: rgb(249, 250, 252);"><strong>Controlla le catene</strong>: sono nel camion, in buono stato, e sai come montarle.</li></ul>'
