              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><span style="color: rgb(0, 0, 0);">Every day, thousands of drivers <strong>drive, share and bring the Michelin Truckfly community to life.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">December is coming, and with it the festive season: public holidays, busy roads, last minute deliveries… All good reasons to <strong>plan your trips well.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">This month, find out <strong>the days you won’t be able to drive over the holidays, how to activate your promo code in 30 seconds, what the truck GPS can do for you, and October’s top contributor!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>And don’t miss our Black Friday offer: it starts tomorrow!</strong></span></p>'
