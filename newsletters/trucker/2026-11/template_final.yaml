          content: '<p><span style="color: rgb(0, 0, 0);">Elke dag zijn duizenden chauffeurs <strong>onderweg, delen ze info en houden ze de Michelin Truckfly community levend.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">December komt eraan, en daarmee de feestdagen: vrije dagen, drukke wegen, last minute leveringen… Genoeg redenen om <strong>je ritten goed voor te bereiden.</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Deze maand ontdek je <strong>op welke dagen je tijdens de feestdagen niet mag rijden, hoe je je promotiecode in 30 seconden activeert, wat de vrachtwagen-GPS voor je kan doen en de topbijdrager van oktober!</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>En mis onze Black Friday-actie niet: morgen gaat hij van start!</strong></span></p>'
