              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">Did you know?</span></strong></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">In December, public holidays come on top of weekends. In France and Italy, that means more days when trucks over 7.5 t are not allowed on the road. Good habit: <strong>plan your deliveries and breaks now.</strong></span></p><p class="default"><br></p>'
        - id: 9f5286f0-3cf7-4a0a-b039-7de14f973cd7
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 10px
              padding-top: 5px
              width: 100%
          content: "<!-- RÉCAP INTERDICTIONS FÊTES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">France<span style=\"font-weight:400;color:#4A4A4A;\"> · over 7.5 t, whole road network</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• From Thursday 24 December 10 pm to Friday 25 December 10 pm</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• From Thursday 31 December 10 pm to Friday 1 January 10 pm</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• And every weekend, from Saturday 10 pm to Sunday 10 pm</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Italy<span style=\"font-weight:400;color:#4A4A4A;\"> · over 7.5 t, outside built-up areas, 9 am to 10 pm</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Sundays 6, 13, 20 and 27 December</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Tuesday 8, Friday 25 and Saturday 26 December</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Spain</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• No general ban, but restrictions on certain road sections. Catalonia, the Basque Country and Navarre have their own rules.</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:4px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#F9FAFC;\">Local bans may be added: check before you set off. And on Michelin Truckfly, find HGV parking along your route in advance.</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Sources: Bison Futé · Italian Ministry of Transport · DGT</p>\n  </td></tr>\n</table>"
