          content: '<p class="default"><strong><span style="color: rgb(249, 250, 252);">Wist je dat?</span></strong></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">In december komen de feestdagen bovenop de weekends. In Frankrijk en Italië betekent dat meer dagen waarop vrachtwagens boven 7,5 t niet mogen rijden. Slim: <strong>plan je leveringen en pauzes nu al.</strong></span></p><p class="default"><br></p>'
        - id: 022401aa-a0fb-4362-bd4b-1977b46cb306
          title: HTML
          type: raw-html
          layout:
            320px: {}
            default:
              padding-bottom: 10px
              padding-top: 5px
              width: 100%
          content: "<!-- RÉCAP INTERDICTIONS FÊTES -->\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:separate;\">\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Frankrijk<span style=\"font-weight:400;color:#4A4A4A;\"> · boven 7,5 t, het hele wegennet</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Van donderdag 24 december 22.00 uur tot vrijdag 25 december 22.00 uur</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Van donderdag 31 december 22.00 uur tot vrijdag 1 januari 22.00 uur</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• En elk weekend, van zaterdag 22.00 uur tot zondag 22.00 uur</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Italië<span style=\"font-weight:400;color:#4A4A4A;\"> · boven 7,5 t, buiten de bebouwde kom, van 9.00 tot 22.00 uur</span></p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Zondag 6, 13, 20 en 27 december</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Dinsdag 8, vrijdag 25 en zaterdag 26 december</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n      <tr><td style=\"padding:12px 16px 12px 14px;border-left:4px solid #FFFF18;background-color:#FFFFFF;border-radius:10px;\">\n        <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;font-weight:700;color:#061866;\">Spanje</p><p style=\"margin:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#000000;\">• Geen algemeen verbod, wel beperkingen op bepaalde trajecten. Catalonië, Baskenland en Navarra hebben eigen regels.</p>\n      </td></tr>\n      <tr><td style=\"height:8px;font-size:0;line-height:0;\">&nbsp;</td></tr>\n  <tr><td style=\"padding:4px 2px 0 2px;\">\n    <p style=\"margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#F9FAFC;\">Er kunnen lokale verboden bijkomen: check dit voor vertrek. En zoek op Michelin Truckfly vooraf de vrachtwagenparkings langs je route.</p>\n    <p style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#F9FAFC;\">Bronnen: Bison Futé · Italiaans ministerie van Transport · DGT</p>\n  </td></tr>\n</table>"
