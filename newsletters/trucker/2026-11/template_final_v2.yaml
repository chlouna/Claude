              padding-top: 0px
              removeMargin: true
              removePadding: false
              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>Le 25 décembre et le 1er janvier, c’est 24&nbsp;h à l’arrêt en France pour les plus de 7,5&nbsp;t. Autant choisir ton aire à l’avance&nbsp;!</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>France</strong> (plus de 7,5&nbsp;t, tout le réseau)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Du jeudi 24 décembre 22&nbsp;h au vendredi 25 décembre 22&nbsp;h</li><li style="color: rgb(249, 250, 252);">Du jeudi 31 décembre 22&nbsp;h au vendredi 1er janvier 22&nbsp;h</li><li style="color: rgb(249, 250, 252);">Et le week-end, comme d’habitude, du samedi 22&nbsp;h au dimanche 22&nbsp;h</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Italie</strong> (plus de 7,5&nbsp;t, hors agglomérations, de 9&nbsp;h à 22&nbsp;h)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Dimanches 6, 13, 20 et 27 décembre</li><li style="color: rgb(249, 250, 252);">Mardi 8, vendredi 25 et samedi 26 décembre</li><li style="color: rgb(249, 250, 252);">Du 25 au 27 décembre, ça fait 3 jours d’affilée</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Espagne</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Pas d’interdiction générale&nbsp;: vérifie les restrictions locales avant de partir.</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Le bon réflexe&nbsp;:</strong> sur Michelin Truckfly, repère dès maintenant les parkings avec douches et resto sur ta route, et lis les avis récents pour savoir ce qui est ouvert pendant les fêtes.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 11px;">Sources&nbsp;: Bison Futé · Ministère italien des Transports</span></p>'
