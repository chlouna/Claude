          content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>El 25 de diciembre y el 1 de enero, los camiones de más de 7,5 t paran 24 horas en Francia. ¡Mejor elegir tu área con antelación!</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>España</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">No hay prohibición general: revisa las restricciones locales antes de salir.</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Francia</strong> (más de 7,5 t, toda la red)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Del jueves 24 de diciembre a las 22 h al viernes 25 a las 22 h</li><li style="color: rgb(249, 250, 252);">Del jueves 31 de diciembre a las 22 h al viernes 1 de enero a las 22 h</li><li style="color: rgb(249, 250, 252);">Y el fin de semana, como siempre, del sábado a las 22 h al domingo a las 22 h</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Italia</strong> (más de 7,5 t, fuera de poblado, de 9 h a 22 h)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Domingos 6, 13, 20 y 27 de diciembre</li><li style="color: rgb(249, 250, 252);">Martes 8, viernes 25 y sábado 26 de diciembre</li><li style="color: rgb(249, 250, 252);">Del 25 al 27 de diciembre, son 3 días seguidos</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Buen reflejo:</strong> en Michelin Truckfly, localiza ya los aparcamientos con duchas y restaurante en tu ruta, y lee las opiniones recientes para saber qué está abierto durante las fiestas.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 11px;">Fuentes: Bison Futé · Ministerio de Transportes italiano</span></p>'
