                  content: '<p class="default"><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Demain, c’est le Black Friday, reste connecté !</strong></span></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);">Pour en profiter, il te suffit d’entrer ton code dans l’appli.</span></p><p><br></p><p class="default"><span style="color: rgb(0, 0, 0);"><strong>Pour ouvrir l’écran Premium, tu as</strong><strong><span style="background-color: rgb(255, 255, 26);"> 2 solutions</span></strong><strong>&nbsp;:</strong></span></p><p class="default"><span style="color: rgb(0, 0, 0);"><br></span></p><ul><li style="color: rgb(0, 0, 0);">Appuie sur l’icône GPS en bas de la carte&nbsp;;</li><li style="color: rgb(0, 0, 0);">ou va dans ton profil, en haut à gauche de la carte, puis appuie sur « Premium · essayer gratuitement ».</li></ul><p><span style="color: rgb(0, 0, 0);"><br></span></p><p class="default"><span style="color: rgb(0, 0, 0);"><strong>Ensuite&nbsp;:</strong></span></p><ol><li style="color: rgb(0, 0, 0);">Choisis «&nbsp;Soit utiliser un code promotionnel&nbsp;».</li><li style="color: rgb(0, 0, 0);">Saisis ton code.</li><li style="color: rgb(0, 0, 0);">Appuie sur « Activer ».</li></ol><p><br></p>'
