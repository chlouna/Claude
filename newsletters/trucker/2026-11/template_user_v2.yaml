                  content: '<p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">En la carretera, confiamos en quienes comparten buena información. <strong>Un camionero con muchos puntos de contribución es un camionero de confianza</strong>: cuando avisa de un peligro o valora una parada, la comunidad sabe que puede contar con él.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255); font-size: 16px; font-family: Arial, Helvetica, sans-serif;">Y la regla es sencilla: <strong>cada acción vale 1 punto.</strong> ¡Con una pausa para el café ya puedes ganar varios!</span></p>'
