                      padding-top: 0px
                      removeMargin: true
                      removePadding: false
                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p class="default"><span style="color: rgb(249, 250, 252);"><strong>¿Lo sabías?</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">En diciembre, los festivos se suman a los fines de semana. En Francia e Italia, eso significa más días en los que los camiones de más de 7,5 t no pueden circular. Buen reflejo: <strong>planifica ya tus entregas y tus pausas.</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>España</strong></span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">No hay prohibición general, sino restricciones en tramos concretos. Cataluña, País Vasco y Navarra tienen sus propias normas.</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Francia</strong> (más de 7,5 t, toda la red)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Del jueves 24 de diciembre a las 22 h al viernes 25 a las 22 h</li><li style="color: rgb(249, 250, 252);">Del jueves 31 de diciembre a las 22 h al viernes 1 de enero a las 22 h</li><li style="color: rgb(249, 250, 252);">Y cada fin de semana, del sábado a las 22 h al domingo a las 22 h</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);"><strong>Italia</strong> (más de 7,5 t, fuera de poblado, de 9 h a 22 h)</span></p><ul dir="ltr"><li style="color: rgb(249, 250, 252);">Domingos 6, 13, 20 y 27 de diciembre</li><li style="color: rgb(249, 250, 252);">Martes 8, viernes 25 y sábado 26 de diciembre</li></ul><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252);">Pueden añadirse restricciones locales: compruébalo antes de salir. Y en Michelin Truckfly, localiza con antelación los aparcamientos para camiones en tu ruta.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(249, 250, 252); font-size: 11px;">Fuentes: Bison Futé · Ministerio de Transportes italiano · DGT</span></p>'
