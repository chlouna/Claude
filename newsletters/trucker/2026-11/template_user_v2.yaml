                  content: '<div data-line="3" data-line-type="context" data-line-index="2" style="font-style: normal; font-weight: 400;" id="isPasted"><span style="color: rgb(255, 255, 255);"><strong>Le savais-tu ?</strong></span></div><div data-line="4" data-line-type="context" data-line-index="3" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><br></span></div><div data-line="5" data-line-type="context" data-line-index="4" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);">86 % des conducteurs poids lourds utilisent un GPS pour véhicules légers, qui peut les mettre en danger.</span></div><div data-line="6" data-line-type="context" data-line-index="5" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><br></span></div><div data-line="7" data-line-type="context" data-line-index="6" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);">Avec les routes chargées et les interdictions des fêtes, ce n’est pas le moment de se tromper de route. <strong>Le GPS Michelin Truckfly prend en compte toutes les contraintes de ton camion :</strong></span></div><div data-line="8" data-line-type="context" data-line-index="7" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><br></span></div><div data-line="9" data-line-type="context" data-line-index="8" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><strong>Une navigation poids lourds :&nbsp;</strong>Gabarit, poids, routes autorisées, restrictions ADR : ton itinéraire est adapté à ton camion.</span></div><div data-line="11" data-line-type="context" data-line-index="10" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><br></span></div><div data-line="12" data-line-type="context" data-line-index="11" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><strong>Les alertes de la communauté :&nbsp;</strong>Zones de contrôle, accidents, dangers : la plus grande communauté poids lourds d’Europe te prévient en temps réel. Et le trafic en direct t’aide à éviter les bouchons.</span></div><div data-line="15" data-line-type="context" data-line-index="14" style="font-style: normal; font-weight: 400;"><br></div><div data-line="18" data-line-type="context" data-line-index="17" style="font-style: normal; font-weight: 400;"><span style="color: rgb(255, 255, 255);"><strong>+135 000 établissements poids lourds :&nbsp;</strong></span><span style="color: rgb(255, 255, 255);">Restaurants, parkings gratuits ou sécurisés, stations-service : tu sais toujours où t’arrêter.</span></div>'
