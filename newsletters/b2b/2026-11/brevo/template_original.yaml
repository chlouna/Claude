                  content: '<p><span style="font-style: normal; font-weight: 400; font-size: 32px; color: rgb(249, 250, 252);" id="isPasted"><strong>Ayudas al gasóleo prorrogadas hasta el 31 de diciembre</strong></span></p>'
                -
                  id: 074012da-15c6-4f54-a7af-9cdaa686210c
                  title: Text
                  type: text
                  layout:
                    320px:
                      width: 100%
                    default:
                      align: left
