                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p><span style="color: rgb(0, 0, 0);">Goedendag,</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Het najaar belooft druk te worden voor het wegtransport. Dieselprijzen, nieuwe regels van land tot land, een elektrificatie die in een stroomversnelling komt: de sector verandert snel, en uw chauffeurs merken dat elke dag op de weg.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Bij Michelin Truckfly zien wij het als onze taak om hen van dichtbij te ondersteunen en u te helpen het overzicht te houden.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Ook deze maand hebben we het belangrijkste voor u op een rij gezet: onze hoogtepunten, onze nieuwigheden en het nieuws dat in elk land telt.</span></p>'
