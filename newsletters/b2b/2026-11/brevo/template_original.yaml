                  content: '<h2 class="default-heading2" id="isPasted"><span style="color:rgb(0, 0, 0);background-color:rgb(255, 255, 26)"><strong><span style="color: rgb(0, 0, 0); background-color: rgb(255, 255, 255);">Profilo Trucker: </span><span style="color: rgb(0, 0, 0); background-color: rgb(255, 255, 26);">gli autisti non viaggiano più da soli</span></strong></span></h2>'
