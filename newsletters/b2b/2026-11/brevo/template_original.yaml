                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p><span style="color: rgb(0, 0, 0);">Il mese scorso vi abbiamo presentato il <strong>Profilo Trucker: </strong>un profilo personalizzato, recensioni sulle strutture, soste preferite e i profili degli altri autisti.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Questo mese, spazio a ciò che ne è il cuore: <strong>la community</strong>. Con le sue funzioni social, Michelin Truckfly diventa una vera rete tra autisti.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Anche da soli in cabina, restano in contatto con i loro colleghi.</strong></span></p>'
