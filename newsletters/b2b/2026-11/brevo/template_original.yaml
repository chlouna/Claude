                  content: '<p><span style="color: rgb(0, 0, 0);">Hello,</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Autumn is shaping up to be a busy season for road transport. Fuel prices, new rules from one country to the next, electrification gathering pace: the sector is changing fast, and your drivers feel it every day on the road.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">At Michelin Truckfly, our role is to support them every step of the way, and to help you see things clearly.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Once again this month, we have gathered the essentials for you: our highlights, our latest features and the news that matters in each country.</span></p>'
