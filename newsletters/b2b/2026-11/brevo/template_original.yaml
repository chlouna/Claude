                  content: '<p><br></p><p class="default" id="isPasted"><strong><span style="color: rgb(12, 22, 91);">Come funziona:</span></strong></p><p class="default"><br></p><p><span style="color: rgb(0, 0, 0);">1. <strong>Aggiungere gli amici</strong> e accettare i loro inviti con un solo gesto.</span></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);">2.<strong>Vedere dove si fermano durante la giornata:</strong> stazione di servizio, area di sosta, parcheggio.</span></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);">3.<strong>&nbsp;Approfittare dei loro consigli</strong>, messi in evidenza nell’app.</span></p><p><br></p>'
