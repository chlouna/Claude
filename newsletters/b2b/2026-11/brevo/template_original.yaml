                  content: '<p><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);" id="isPasted">Il disegno di legge di bilancio 2027 è atteso intorno al 20 ottobre. Unatras chiede una riduzione delle tasse sul gasolio, che incide per il 35% sui costi di un&#39;impresa di autotrasporto. Il governo parla di aiuti mirati.&nbsp;</span></p><p><span style="color: rgb(249, 250, 252);"><br></span></p><p><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);">Già in vigore: il credito d&#39;imposta sul gasolio è stato ampliato a inizio ottobre. E dal 15 novembre, obbligo di pneumatici invernali o catene a bordo sulle strade segnalate.</span></p>'
