                  content: '<p><span style="color: rgb(0, 0, 0);">Vorige maand stelden we u het <strong>Truckerprofiel </strong>voor: een persoonlijk profiel, beoordelingen van locaties, favoriete stops en de profielen van andere chauffeurs.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Deze maand draait alles om de kern</strong>: de community. Dankzij de sociale functies wordt Michelin Truckfly een echt netwerk tussen chauffeurs.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Ook alleen in hun cabine blijven ze verbonden met hun collega’s.</strong></span></p>'
