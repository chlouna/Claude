                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p><span style="font-style: normal; font-weight: 400; color: rgb(255, 255, 255);" id="isPasted">El Real Decreto-ley 25/2026, <strong>en vigor desde el 1 de octubre, prorroga las ayudas al transporte hasta final de año.</strong></span></p><p><br></p><p><span style="font-style: normal; font-weight: 400; color: rgb(255, 255, 255);">La rebaja del Impuesto sobre Hidrocarburos alcanza los 20 céntimos por litro en octubre, <strong>y después 13 en noviembre y 6 en diciembre</strong>. Con la tarjeta de gasóleo profesional, se suma una ayuda adicional de 5, 12 y 19 céntimos por litro, respectivamente.&nbsp;</span></p><p><br></p><p><span style="font-style: normal; font-weight: 400; color: rgb(255, 255, 255);">Para los vehículos sin gasóleo profesional, la ayuda por vehículo debe solicitarse antes del 30 de octubre.</span></p>'
