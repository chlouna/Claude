                  content: '<p><br></p><p><span style="color: rgb(0, 0, 0);">Buongiorno,</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">L’autunno si preannuncia intenso per l’autotrasporto. Prezzo del gasolio, nuove regole da un Paese all’altro, un’elettrificazione che accelera: il settore cambia in fretta, e i vostri autisti lo vivono ogni giorno su strada.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">In Michelin Truckfly, il nostro ruolo è accompagnarli da vicino e aiutarvi a vederci chiaro.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Anche questo mese abbiamo raccolto per voi l’essenziale: i nostri momenti salienti, le nostre novità e le notizie che contano in ogni Paese.</span></p>'
