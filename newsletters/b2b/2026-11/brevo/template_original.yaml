                  content: '<div data-turn-id-container="request-WEB:451151c2-2be5-4367-bc16-24668913977a-16" data-is-intersecting="true" id="isPasted"><section dir="auto" data-turn-id="request-WEB:451151c2-2be5-4367-bc16-24668913977a-16" data-turn-id-container="request-WEB:451151c2-2be5-4367-bc16-24668913977a-16" data-testid="conversation-turn-34" data-scroll-anchor="false" data-turn="assistant"><div data-conversation-screenshot-content=""><p class="default"><span style="font-size: 16px;"><br></span></p></div></section><p class="default" id="isPasted"><span style="color: rgb(255, 255, 255);"><strong>1er et 2 décembre 2026 -&nbsp;</strong></span><span style="color: rgb(255, 255, 255);"><strong>Paris Expo Porte de Versailles</strong></span></p><p class="default"><span style="color: rgb(255, 255, 255);"><br></span></p><p class="default"><span style="color: rgb(255, 255, 255);">Le Supply Chain Event réunit chaque année les décideurs de la logistique et de la supply chain. Au programme : plus de 110 exposants, 40 conférences et des rendez-vous d’affaires pour repérer les solutions qui feront la différence en 2027.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(255, 255, 255);"><strong>Pourquoi c’est intéressant pour vous ?</strong></span></p><p class="default"><br></p><ul dir="ltr"><li style="color: rgb(255, 255, 255);">Découvrir les dernières innovations en transport, entrepôt et digitalisation des flux</li><li style="color: rgb(255, 255, 255);">Suivre des conférences sur les sujets du moment : décarbonation, coûts, recrutement</li><li style="color: rgb(255, 255, 255);">Rencontrer des partenaires et échanger avec les acteurs du secteur</li></ul></div>'
