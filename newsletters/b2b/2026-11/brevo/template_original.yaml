                  content: '<p><span style="color: rgb(0, 0, 0); font-family: arial, helvetica, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; display: inline !important; float: none;">El mes pasado te presentamos el&nbsp;</span><strong>Perfil Trucker</strong><span style="color: rgb(0, 0, 0); font-family: arial, helvetica, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; display: inline !important; float: none;">: un perfil personalizado, opiniones sobre los establecimientos, paradas favoritas y los perfiles de otros conductores.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Este mes, nos centramos en lo esencial: <strong>la comunidad</strong>. Con sus funciones sociales, Michelin Truckfly se convierte en una verdadera red entre conductores.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><strong>Incluso solos en su cabina, siguen conectados con sus compañeros.</strong></span></p>'
