                      padding-top: 15px
                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<h2 class="default-heading2" id="isPasted"><span style="color: rgb(0, 0, 0); background-color: rgb(255, 255, 255);"><strong>Trucker Profile: </strong></span><span style="color: rgb(0, 0, 0); background-color: rgb(255, 255, 26);"><strong>drivers no longer ride alone</strong></span></h2>'
                -
                  id: 4e607064-fad7-40c9-bfab-6b6613a5b24f
                  title: Text
                  type: text
                  layout:
                    320px:
                      width: 100%
                    default:
                      align: left
                      groupPadding: false
                      padding-bottom: 0px
                      padding-top: 15px
                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p class="default" id="isPasted"><br></p><p class="default" id="isPasted"><span style="color: rgb(0, 0, 0);">Last month, we introduced the <strong>Trucker Profile</strong>: a personalised profile, reviews of establishments, favourite stops and other drivers’ profiles.</span></p><p class="default"><br></p><p class="default"><span style="color: rgb(0, 0, 0);">This month, we focus on what lies at its heart:<strong>&nbsp;the community.</strong> With its social features,<strong>&nbsp;Michelin Truckfly becomes a true network between drivers.</strong></span></p><p class="default"><br></p><p class="default"><span style="color: rgb(0, 0, 0);">Even alone in their cab, they stay<strong>&nbsp;connected</strong> to their colleagues.</span></p><p class="default"><br></p>'
                -
                  id: 7cd4323c-c5a2-4a75-bd25-52d1f1977d2e
                  title: Text
                  type: text
                  layout:
                    320px:
                      width: 100%
                    default:
                      align: left
                      groupPadding: false
                      line-height: '1'
                      padding-bottom: 0px
                      padding-top: 15px
                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p><strong><span style="color: rgb(12, 22, 91);">How it works :</span></strong></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);"><strong id="isPasted">1.</strong>&nbsp;<strong>Add friends </strong>and accept their invitations in a single tap.</span></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);"><strong>2.&nbsp;</strong><strong>See where they stop&nbsp;</strong>throughout the day: fuel station, truck stop, parking area.</span></p><p><span style="color: rgb(0, 0, 0);"><br></span></p><p><span style="color: rgb(0, 0, 0);"><strong>3.&nbsp;</strong><strong>Benefit from their recommendations</strong>, highlighted in the app.</span></p><p><br></p>'
