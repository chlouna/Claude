                  content: '<p><br></p><p><span style="font-style: normal; font-weight: 400; color: rgb(255, 255, 255);" id="isPasted">In Q3 2026, new HGV registrations in the UK rose by <strong>7.2%</strong> to <strong>9,941 units</strong>, the <strong>first growth in two years</strong>, according to SMMT. However, the market is still down <strong>3.8%</strong> year to date.</span></p><p><br></p><p><span style="font-style: normal; font-weight: 400; color: rgb(255, 255, 255);" id="isPasted">Zero-emission trucks went the other way: registrations <strong>halved</strong> and now account for just <strong>1.1%</strong> of the market. SMMT points to purchase costs and the <strong>lack of depot charging</strong>, exactly what projects like Welch’s Transport’s new hub near Cambridge aim to address.</span></p>'
