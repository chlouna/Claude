              text-align: left
              text-valign: top
              valign: top
              width: 100%
          content: '<p><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);" id="isPasted"><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);" id="isPasted">L’A13 est coupée dans le sens Paris-province entre le périphérique et Vaucresson, 24 h/24, pour les travaux du tunnel de Saint-Cloud. Une zone à trafic restreint est mise en place autour de Saint-Cloud : les poids lourds de plus de 7,5 t en transit doivent contourner l’Île-de-France, par la Francilienne notamment.</span></span></p><p><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);"><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);"><br id="isPasted">Itinéraires conseillés : RN118, RN12, A86 et A12 au sud, ou RN13 et A14 au nord. La gratuité de l’A14 annoncée ne concerne pas les camions à ce stade : TLF demande qu’elle soit étendue aux poids lourds et aux utilitaires professionnels.</span></span></p><p><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);"><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);"><br></span><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252); font-size: 11px;">Sources : OTRE · Union TLF · L’Automobiliste</span></span></p>'
