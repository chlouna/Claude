          content: "<h4 class=\"texte-fonce\" style=\"margin:4px 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#061866;\">Cosa Le offre</h4>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Aziende di trasporto e gestori di flotte</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Autisti che si riconoscono nelle aree di sosta e comunicano più facilmente: una community più umana, che rompe l’isolamento della strada.</p>\n  </td></tr>\n</table>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Partner e marchi</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Una community che si conosce e torna nell’app ogni giorno: un pubblico coinvolto, attento ai contenuti che gli sono utili.</p>\n  </td></tr>\n</table>\n"
