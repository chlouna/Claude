          content: '<div data-index="22" style="font-style:normal;font-weight:400;" id="isPasted" tabindex="-1" data-test-render-count="2" data-user-message-bubble="true" data-testid="user-message"><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);" id="isPasted"><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252);" id="isPasted">Les polices routières européennes du réseau ROADPOL mènent leur dernière opération de l’année sur les poids lourds et autocars. Au programme : tachygraphe, temps de conduite et de repos.<br><br id="isPasted">En parallèle, la révision de la directive poids et dimensions est toujours en négociation : les constructeurs demandent que les camions électriques et hydrogène ne perdent pas de charge utile par rapport au diesel.<br><br></span><span style="font-style: normal; font-weight: 400; color: rgb(249, 250, 252); font-size: 11px;" id="isPasted">Sources : Transportonline · HGV Ireland</span></span></div>'
