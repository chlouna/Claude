          content: "<h4 class=\"texte-fonce\" style=\"margin:4px 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#061866;\">What’s in it for you</h4>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Hauliers and fleet managers</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Drivers who recognise each other at truck stops and talk more easily: a more human community that breaks the isolation of the road.</p>\n  </td></tr>\n</table>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Partners and brands</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">A community that knows each other and comes back to the app every day: an engaged audience, attentive to content that is useful to them.</p>\n  </td></tr>\n</table>\n"
