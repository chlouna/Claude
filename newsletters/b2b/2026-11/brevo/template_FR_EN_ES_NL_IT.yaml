          content: "<h4 class=\"texte-fonce\" style=\"margin:4px 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#061866;\">Wat het u oplevert</h4>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Transportbedrijven en wagenparkbeheerders</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Uw chauffeurs van alle nationaliteiten gebruiken de app in hun eigen taal, zelfs op een gedeelde werktelefoon. Minder fouten, meer zelfstandigheid, geen telefooninstellingen te wijzigen.</p>\n  </td></tr>\n</table>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Locaties</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Truckers uit heel Europa gebruiken de app in hun eigen taal: zij vinden de informatie over de locatie makkelijker.</p>\n  </td></tr>\n</table>\n"
