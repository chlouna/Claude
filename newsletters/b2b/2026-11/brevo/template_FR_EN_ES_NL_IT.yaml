          content: '<p><span style="color: rgb(249, 250, 252);">Lo schema del nuovo Codice della strada, approvato in via preliminare dal Consiglio dei ministri il 13 ottobre, è ora all’esame del Parlamento. Tra le novità per l’autotrasporto: guida professionale fino a 70 anni (oggi 68) con visita ogni 2 anni, e possibilità di guidare prima di ottenere la CQC limitata a 1 anno, una sola volta.</span></p><p><br></p><p><span style="color: rgb(249, 250, 252);">Il testo può ancora cambiare: le commissioni della Camera devono dare il loro parere entro il 12 gennaio 2027 e l’entrata in vigore è prevista non prima del 2028.</span></p><p><br></p><p><span style="color: rgb(249, 250, 252); font-size: 11px;">Fonte: Uomini e Trasporti</span></p>'
