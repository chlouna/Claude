          content: '<p><strong id="isPasted"><span style="color: rgb(255, 255, 255); font-size: 32px;">A13 : sens Paris-province fermé dès le 16 novembre, jusqu’à fin août 2027</span></strong></p>'
        - id: 821a596f-c3be-4d7f-b9e9-94cc1d911e62
