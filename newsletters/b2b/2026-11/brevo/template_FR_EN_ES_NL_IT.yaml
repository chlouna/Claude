          content: '<p><span style="color: rgb(249, 250, 252);">Le polizie stradali europee della rete ROADPOL svolgono l’ultima campagna dell’anno su camion e autobus. Sotto la lente: tachigrafo, tempi di guida e di riposo.</span></p><p><br></p><p><span style="color: rgb(249, 250, 252);">Intanto la revisione della direttiva su pesi e dimensioni è ancora in fase di negoziato: i costruttori chiedono che i camion elettrici e a idrogeno non perdano carico utile rispetto al diesel.</span></p><p><br></p><p><span style="color: rgb(249, 250, 252); font-size: 11px;">Fonti: Transportonline · HGV Ireland</span></p>'
