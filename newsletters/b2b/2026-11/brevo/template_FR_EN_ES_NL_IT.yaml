          content: '<p><span style="color: rgb(0, 0, 0);">Goedendag,</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Met de winter worden de dagen korter, worden de omstandigheden op de weg zwaarder en neemt de drukte aan het eind van het jaar toe. Een veeleisende periode voor uw chauffeurs en voor uw teams.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Bij MICHELIN Truckfly willen we u helpen deze periode met een gerust hart in te gaan, met betrouwbare informatie en handige tools voor elke dag.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Deze maand vindt u het belangrijkste: de komende evenementen, ons nieuws en de ontwikkelingen die er in elk land toe doen.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Veel leesplezier,</span></p>'
