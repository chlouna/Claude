          content: "<h4 class=\"texte-fonce\" style=\"margin:4px 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#061866;\">Ce que ça vous apporte</h4>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Transporteurs et gestionnaires de flotte</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Des conducteurs qui se reconnaissent sur les aires et échangent plus facilement : une communauté plus humaine, qui rompt l'isolement de la route.</p>\n  </td></tr>\n</table>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 10px 0;\">\n  <tr><td class=\"bref\" style=\"background-color:#F5F3F1;border-radius:12px;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;\">\n    <p class=\"texte-fonce\" style=\"margin:0 0 4px 0;font-size:16px;line-height:23px;font-weight:bold;color:#061866;\">Partenaires et marques</p>\n    <p class=\"texte-fonce\" style=\"margin:0;font-size:16px;line-height:24px;color:#000000;\">Une communauté qui se connaît et revient dans l'appli chaque jour : un public engagé, attentif aux contenus qui lui sont utiles.</p>\n  </td></tr>\n</table>"
