<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bib";
        src: url("assets/fonts/BIB-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Bib";
        src: url("assets/fonts/BIB-Light.woff2") format("woff2");
        font-weight: 300;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f5f3f1;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bib", sans-serif;
      }
      .plein {
        position: absolute;
        inset: 0;
      }
      #fond-couleur {
        position: absolute;
        inset: 0;
        background: #f5f3f1;
      }

      /* Textes */
      #textes {
        position: absolute;
        left: 160px;
        top: 0;
        bottom: 0;
        width: 1000px;
      }
      .etape {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: #000000;
      }
      .ligne {
        display: block;
        white-space: nowrap;
      }
      .titre {
        font-weight: 700;
        font-size: 96px;
        line-height: 1.12;
      }
      .sous {
        font-weight: 300;
        font-size: 64px;
        line-height: 1.2;
        margin-top: 16px;
      }
      .emoji {
        display: inline-block;
        height: 0.95em;
        width: auto;
        vertical-align: -0.12em;
        margin-left: 0.15em;
      }
      #t5 {
        left: -160px;
        width: 1920px;
        align-items: center;
        text-align: center;
        color: #ffffff;
      }
      #t5 .titre {
        font-size: 128px;
      }

      /* Téléphone */
      #telephone {
        position: absolute;
        right: 240px;
        top: 60px;
        width: 520px;
        height: 880px;
      }
      .ecran {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cadre {
        position: relative;
        height: 100%;
        aspect-ratio: 460 / 911;
      }
      .cadre img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #repere {
        position: absolute;
        left: 12.6%;
        top: 31.6%;
        width: 74.8%;
        height: 7%;
        border: 6px solid #061866;
        border-radius: 18px;
      }

      /* Logo discret, en bas au centre */
      #logos {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 66px;
        height: 56px;
      }
      .logo {
        position: absolute;
        left: 50%;
        margin-left: -111px;
        width: 222px;
        height: 56px;
      }

      /* Version verticale : texte en haut, téléphone au centre, logo en bas */
      #textes {
        left: 30px;
        right: 30px;
        top: 250px;
        bottom: auto;
        width: auto;
        height: 400px;
      }
      .etape {
        align-items: center;
        text-align: center;
      }
      .titre {
        font-size: 80px;
      }
      .sous {
        font-size: 52px;
      }
      #t5 {
        left: -30px;
        right: -30px;
        width: auto;
        top: -250px;
        bottom: auto;
        height: 1920px;
      }
      #t5 .titre {
        font-size: 88px;
      }
      #telephone {
        left: 0;
        right: 0;
        top: 680px;
        width: auto;
        height: 860px;
      }
      #logos {
        bottom: 290px;
        height: 70px;
      }
      .logo {
        margin-left: -139px;
        width: 278px;
        height: 70px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vertical"
      data-start="0"
      data-duration="16"
      data-width="1080"
      data-height="1920"
    >
      <div id="fond" class="plein clip" data-start="0" data-duration="16" data-track-index="0">
        <div id="fond-couleur"></div>
      </div>

      <div id="ecrans" class="plein clip" data-start="0" data-duration="13.2" data-track-index="1">
        <div id="telephone">
          <div id="e1" class="ecran">
            <div class="cadre">
              <img src="assets/ecrans/v2-profil.png" alt="" />
              <div id="repere"></div>
            </div>
          </div>
          <div id="e2" class="ecran">
            <div class="cadre"><img src="assets/ecrans/v2-trouver-routiers.png" alt="" /></div>
          </div>
          <div id="e3" class="ecran">
            <div class="cadre"><img src="assets/ecrans/v2-fil-activite.png" alt="" /></div>
          </div>
        </div>
      </div>

      <div id="textes-clip" class="plein clip" data-start="0" data-duration="16" data-track-index="2">
        <div id="textes">
          <div id="t1" class="etape">
            <span class="ligne titre">Crée ton Profil Trucker</span>
            <span class="ligne sous"
              >pour que tes amis te retrouvent<img class="emoji" src="assets/emoji/main.png" alt="👋"
            /></span>
          </div>
          <div id="t2" class="etape">
            <span class="ligne titre">Personnalise</span>
            <span class="ligne titre">et partage ton profil</span>
          </div>
          <div id="t3" class="etape">
            <span class="ligne titre">Retrouve tes amis</span>
          </div>
          <div id="t4" class="etape">
            <span class="ligne titre">Suis l'activité de</span>
            <span class="ligne titre">tes proches au quotidien</span>
          </div>
          <div id="t5" class="etape" data-layout-allow-overflow>
            <span class="ligne titre"
              >Ne roule plus seul<img class="emoji" src="assets/emoji/camion.png" alt="🚛"
            /></span>
          </div>
        </div>
      </div>

      <div id="logos-clip" class="plein clip" data-start="0" data-duration="16" data-track-index="3">
        <div id="logos">
          <img id="logo-c" class="logo" src="assets/logos/truckfly-couleur-rogne.png" alt="Michelin Truckfly" />
          <img id="logo-b" class="logo" src="assets/logos/truckfly-blanc-rogne.png" alt="" />
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const entre = { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 };
      const sort = { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" };
      const arrive = { xPercent: 0, autoAlpha: 1, duration: 0.5, ease: "power2.inOut" };
      const part = { xPercent: -30, autoAlpha: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false };

      function texte(id, debut, fin) {
        tl.fromTo(`${id} .ligne`, { autoAlpha: 0, y: 40 }, entre, debut);
        if (fin !== undefined) tl.to(id, sort, fin);
      }

      // Textes (minutage : 0–4,2 · 4,2–7,2 · 7,2–9,6 · 9,6–13,2 · 13,2–16)
      texte("#t1", 0.3, 3.95);
      texte("#t2", 4.3, 6.95);
      texte("#t3", 7.3, 9.35);
      texte("#t4", 9.7, 12.9);
      texte("#t5", 13.35);

      // Téléphone : le profil apparaît progressivement
      tl.fromTo("#telephone", { autoAlpha: 0, y: 160 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.15);
      // Personnalise et partage : repère sur les deux boutons
      tl.fromTo("#repere", { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 4.7);
      tl.to("#repere", { autoAlpha: 0, duration: 0.25 }, 6.95);
      // Retrouve tes amis
      tl.fromTo("#e2", { xPercent: 60, autoAlpha: 0 }, arrive, 7.0);
      tl.fromTo("#e1", { xPercent: 0, autoAlpha: 1 }, part, 7.0);
      // Activité des proches
      tl.fromTo("#e3", { xPercent: 60, autoAlpha: 0 }, arrive, 9.4);
      tl.fromTo("#e2", { xPercent: 0, autoAlpha: 1 }, { ...part, immediateRender: false }, 9.4);
      tl.to("#telephone", { autoAlpha: 0, y: 80, duration: 0.3, ease: "power2.in" }, 12.9);

      // Fin : fond bleu, logo blanc
      tl.to("#fond-couleur", { backgroundColor: "#061866", duration: 0.4, ease: "power1.inOut" }, 12.95);
      tl.fromTo("#logo-b", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 12.95);
      tl.fromTo("#logo-c", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.4 }, 12.95);

      window.__timelines["vertical"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
