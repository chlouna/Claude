<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bib";
        src: url("../assets/fonts/BIB-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Bib";
        src: url("../assets/fonts/BIB-Light.woff2") format("woff2");
        font-weight: 300;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #061866;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bib", sans-serif;
      }
      #fond {
        position: absolute;
        inset: 0;
      }
      #fond-couleur {
        position: absolute;
        inset: 0;
        background: #061866;
      }
      .scene {
        position: absolute;
        inset: 0;
      }

      /* Scène 1 et 5 : titre centré sur fond bleu */
      .centre {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        text-align: center;
      }
      .ligne {
        display: block;
      }
      .leger {
        font-weight: 300;
        font-size: 80px;
        line-height: 1.15;
      }
      .fort {
        font-weight: 700;
        font-size: 128px;
        line-height: 1.1;
      }
      .souligne {
        position: relative;
        display: inline-block;
      }
      .trait {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -14px;
        height: 12px;
        background: #ffff1a;
        transform-origin: left center;
      }

      /* Étapes : texte à gauche, téléphone à droite */
      #etapes-textes {
        position: absolute;
        left: 160px;
        top: 0;
        bottom: 0;
        width: 900px;
      }
      .etape {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .numero {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: #061866;
        color: #ffffff;
        font-weight: 700;
        font-size: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 44px;
      }
      .etape-texte {
        color: #000000;
        font-weight: 700;
        font-size: 92px;
        line-height: 1.1;
        text-wrap: balance;
      }
      #telephone {
        position: absolute;
        right: 220px;
        top: 70px;
        width: 520px;
        height: 940px;
      }
      .ecran {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ecran img {
        display: block;
        height: 100%;
        width: auto;
      }

      /* Fin */
      #s5-titre {
        font-size: 100px;
      }
      #logo-fin {
        display: block;
        width: 820px;
        height: auto;
        margin-bottom: 90px;
      }

      /* Version verticale : texte en haut, téléphone en dessous */
      .centre {
        padding: 0 60px;
      }
      .leger {
        font-size: 88px;
      }
      .fort {
        font-size: 104px;
        white-space: nowrap;
      }
      #etapes-textes {
        left: 50px;
        right: 50px;
        top: 260px;
        bottom: auto;
        width: auto;
        height: 470px;
      }
      .etape {
        align-items: center;
        text-align: center;
      }
      .numero {
        width: 120px;
        height: 120px;
        font-size: 72px;
        margin-bottom: 36px;
      }
      .etape-texte {
        font-size: 80px;
      }
      #telephone {
        left: 0;
        right: 0;
        top: 750px;
        width: auto;
        height: 920px;
      }
      #s5-titre {
        font-size: 96px;
        line-height: 1.15;
      }
      #logo-fin {
        width: 860px;
        margin-bottom: 120px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vertical"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="fond" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div id="fond-couleur"></div>
      </div>

      <div id="s1" class="scene clip" data-start="0" data-duration="2.7" data-track-index="1">
        <div class="centre">
          <span id="s1-l1" class="ligne leger">Nouveau :</span>
          <span id="s1-l2" class="ligne fort"
            >le <span class="souligne">Profil Trucker<span id="s1-trait" class="trait"></span></span
          ></span>
        </div>
      </div>

      <div id="etapes" class="scene clip" data-start="2.7" data-duration="9" data-track-index="2">
        <div id="etapes-textes">
          <div id="t1" class="etape">
            <div class="numero">1</div>
            <div class="etape-texte">Accède à ton profil</div>
          </div>
          <div id="t2" class="etape">
            <div class="numero">2</div>
            <div class="etape-texte">Crée et personnalise ton profil</div>
          </div>
          <div id="t3" class="etape">
            <div class="numero">3</div>
            <div class="etape-texte">Ajoute tes infos, rejoins la communauté</div>
          </div>
        </div>
        <div id="telephone">
          <div id="e1" class="ecran"><img src="../assets/ecrans/etape1-profil.png" alt="" /></div>
          <div id="e2" class="ecran"><img src="../assets/ecrans/etape2-profil-perso.png" alt="" /></div>
          <div id="e3" class="ecran"><img src="../assets/ecrans/etape3-communaute.png" alt="" /></div>
        </div>
      </div>

      <div id="s5" class="scene clip" data-start="11.7" data-duration="3.3" data-track-index="3">
        <div class="centre">
          <img id="logo-fin" src="../assets/logos/truckfly-blanc-rogne.png" alt="Michelin Truckfly" />
          <span id="s5-titre" class="ligne fort"
            ><span class="souligne"><span class="ligne">Télécharge</span><span class="ligne">Michelin Truckfly</span><span id="s5-trait" class="trait"></span></span
          ></span>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const entre = { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" };
      const sort = { opacity: 0, y: -24, duration: 0.25, ease: "power2.in" };
      const entreAlpha = { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" };
      const sortAlpha = { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" };
      const glisse = { duration: 0.5, ease: "power2.inOut" };

      // Fond : bleu → off white → bleu
      tl.to("#fond-couleur", { backgroundColor: "#F5F3F1", duration: 0.4, ease: "power1.inOut" }, 2.4);
      tl.to("#fond-couleur", { backgroundColor: "#061866", duration: 0.4, ease: "power1.inOut" }, 11.4);

      // Scène 1
      tl.fromTo("#s1-l1", { opacity: 0, y: 40 }, entre, 0.2);
      tl.fromTo("#s1-l2", { opacity: 0, y: 40 }, entre, 0.35);
      tl.fromTo("#s1-trait", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.9);
      tl.to(["#s1-l1", "#s1-l2"], sort, 2.4);

      // Étapes : textes
      tl.fromTo("#t1", { autoAlpha: 0, y: 40 }, entreAlpha, 2.9);
      tl.to("#t1", sortAlpha, 5.1);
      tl.fromTo("#t2", { autoAlpha: 0, y: 40 }, entreAlpha, 5.45);
      tl.to("#t2", sortAlpha, 8.1);
      tl.fromTo("#t3", { autoAlpha: 0, y: 40 }, entreAlpha, 8.45);
      tl.to("#t3", sortAlpha, 11.35);

      // Étapes : téléphone
      tl.fromTo("#telephone", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.8);
      tl.fromTo("#e2", { xPercent: 60, autoAlpha: 0 }, { xPercent: 0, autoAlpha: 1, ...glisse }, 5.2);
      tl.fromTo("#e1", { xPercent: 0, autoAlpha: 1 }, { xPercent: -30, autoAlpha: 0, ...glisse }, 5.2);
      tl.fromTo("#e3", { xPercent: 60, autoAlpha: 0 }, { xPercent: 0, autoAlpha: 1, ...glisse }, 8.2);
      tl.fromTo("#e2", { xPercent: 0, autoAlpha: 1 }, { xPercent: -30, autoAlpha: 0, ...glisse, immediateRender: false }, 8.2);
      tl.to("#telephone", { opacity: 0, duration: 0.3, ease: "power2.in" }, 11.35);

      // Scène 5
      tl.fromTo("#logo-fin", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 11.9);
      tl.fromTo("#s5-titre", { opacity: 0, y: 40 }, entre, 12.3);
      tl.fromTo("#s5-trait", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 12.75);

      window.__timelines["vertical"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
