:root { --noir: #0a0a0c; --blanc: #fff; --jaune: #FFFF1A; --gris: #c9c9d1; --barre: #8a8a92; }
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Titres façon police MICHELIN (remplaçant) : Archivo Black Italic semi-élargie, lettres resserrées */
.boite, .date, .tag, .prix .n, .cta, .accroche, .planche h1, .planche h2 { letter-spacing: -.03em; word-spacing: .12em; }
body { background: #e6e6ea; font-family: "Texte", sans-serif; font-style: italic; color: #111; padding: 48px; }

/* ---------- Plaquette ---------- */
.planche { width: 2100px; }
.planche h1 { font: 900 italic 32px "Titre"; color: #111; text-transform: uppercase; }
.planche > p { margin: 8px 0 40px; color: #53565A; font-size: 15px; max-width: 1100px; line-height: 1.45; }
.section { margin-bottom: 56px; }
.section h2 { font: 900 italic 20px "Titre"; text-transform: uppercase; color: #111; }
.section h2 + p { font-size: 14px; color: #53565A; margin: 4px 0 18px; }
.rangee { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
.rangee + .rangee { margin-top: 28px; }
figure { display: flex; flex-direction: column; gap: 8px; }
figcaption { font-size: 12px; color: #53565A; }
figcaption b { color: #111; }

/* ---------- Éléments communs ---------- */
.kv { position: relative; isolation: isolate; overflow: hidden; color: var(--blanc); font-size: var(--u); width: var(--w); height: var(--h);
  background: radial-gradient(90% 55% at 80% 80%, #26262e 0%, transparent 70%), var(--noir); }
.logo { height: 2.5em; width: auto; align-self: flex-start; display: block; position: relative; z-index: 4; }
.titre { position: relative; display: flex; justify-content: center; align-items: center; }
/* Trait blanc : tout au fond, derrière le téléphone et les textes */
.titre .ligne { position: absolute; z-index: -1; left: -5em; right: -5em; top: 50%; height: .12em; background: rgba(255,255,255,.9); }
.boite { position: relative; z-index: 2; background: var(--blanc); color: #111; border-radius: .8em;
  font: 900 italic 4.2em/1.02 "Titre"; text-transform: uppercase; text-align: center; padding: .28em .5em .3em; }
.boite span { display: block; }
.date { position: absolute; z-index: 3; left: 50%; bottom: -1.5em; transform: translateX(-50%) rotate(-3deg);
  background: var(--jaune); color: #111; border-radius: .5em; white-space: nowrap;
  font: 900 italic 2.1em/1 "Titre"; text-transform: uppercase; padding: .45em .7em .4em; box-shadow: 0 .2em .6em rgba(0,0,0,.3); }
.date small { font-size: .62em; margin: 0 .25em; vertical-align: .12em; }
.sous { font: italic 600 1.45em/1.35 "Texte"; color: var(--gris); }
.sous b { color: var(--blanc); font-weight: 700; }
.tag { position: relative; display: inline-flex; background: var(--jaune); color: #111;
  font: 900 italic 1em/1 "Titre"; white-space: nowrap;
  clip-path: polygon(16% 0, 100% 0, 100% 100%, 16% 100%, 0 50%); padding: .16em .32em .12em .66em; transform: rotate(-8deg); }
.tag i { position: absolute; left: .2em; top: 50%; width: .14em; height: .14em; margin-top: -.07em; border-radius: 50%; background: #111; }
.tag small { font-size: .42em; margin-left: .06em; margin-top: .22em; }
.prix { display: flex; flex-direction: column; gap: .35em; white-space: nowrap; }
.prix .n { font: 900 italic 2.9em/1 "Titre"; }
.prix .n em { font: italic 600 .45em "Texte"; margin-left: .15em; }
.prix .barre { font: italic 600 1.45em/1 "Texte"; color: var(--barre); text-decoration: line-through; }
.cta { display: inline-flex; justify-content: center; align-items: center; font: 900 italic 1.4em/1 "Titre"; text-transform: uppercase;
  background: var(--jaune); color: #111; padding: .95em 1.5em; border-radius: .6em; white-space: nowrap; box-shadow: 0 .4em 1.2em rgba(0,0,0,.35); }
.cta.contour { background: var(--noir); color: var(--blanc); box-shadow: inset 0 0 0 .12em var(--blanc), 0 .4em 1.2em rgba(0,0,0,.35); }
.tel { position: absolute; filter: drop-shadow(0 1.6em 2.4em rgba(0,0,0,.5)); z-index: 1; }
.tel.ombre { filter: brightness(var(--lum)) saturate(.6) drop-shadow(0 1.6em 2.4em rgba(0,0,0,.6)); }
.halo { position: absolute; z-index: 0; width: 44em; height: 44em; left: 50%; margin-left: -22em; top: 26em;

.fondu::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 2;

.accroche { position: relative; z-index: 3; font: 900 italic 2.5em/1.1 "Titre"; color: var(--blanc); }
.compte { position: relative; z-index: 3; font: italic 400 1.6em/1.1 "Texte"; color: var(--blanc); white-space: nowrap; text-align: center; }
.rdv { display: flex; align-items: center; gap: .9em; font: italic 700 1.15em/1 "Texte"; letter-spacing: .12em; text-transform: uppercase; color: var(--blanc); white-space: nowrap; }
.rdv::before, .rdv::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.55); }

.v .legal { font: italic 400 .95em/1.35 "Texte"; color: var(--barre); text-align: center; }

const LANGS = Object.keys(L);

/* ===== Briques ===== */
const logo = `<img class="logo" src="${LOGO}" alt="Michelin Truckfly">`;
const titre = date => `<div class="titre"><div class="ligne"></div>

const tag = `<div class="tag"><i></i>-50<small>%</small></div>`;
const CODE = "BF50";
const code = t => `<div class="code"><small>${t.motCode}</small>${CODE}</div>`;
const ligneCode = t => `<div class="ligne-code">${code(t)}</div>`;
const prix = t => `<div class="prix"><span class="n">${t.prix}<em>${t.an}</em></span><span class="barre">${t.barre}</span></div>`;
const lignePrix = t => `<div class="ligne-prix ${t.long ? "long" : ""}">${tag}${prix(t)}</div>`;
const tel = lum => (lum < 1 ? `<div class="halo"></div>` : "") + `<img class="tel ${lum < 1 ? "ombre" : ""}" src="${telLangue}" alt="" style="--lum:${lum}">`;
const cta = (txt, contour) => `<span class="cta ${contour ? "contour" : ""}">${txt}</span>`;
const rdv = txt => `<span class="rdv">${txt}</span>`;
const fleche = `<span class="fleche"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>`;
const FR = L.fr;

/* ===== Stories (FR, 1080 × 1920) ===== */
const S = (cls, inner) => `<div class="kv v story fondu ${cls}" style="--w:360px;--h:640px;--u:10px">${inner}</div>`;
const storyQuestion = () => S("question", `${titre(FR.dTeasing)}<h3 class="accroche">${FR.question}</h3>${tel(.3)}<div class="bas">${rdv("Le 27/11 dans l'app")}</div>`);
const storyAvant = (compte, sous, lum, date = FR.dTeasing) => S("avant", `${titre(date)}<p class="compte">${compte}</p><p class="sous">${sous}</p>${tel(lum)}<div class="bas">${rdv("Le 27/11 dans l'app")}</div>`);
const storyOffre = date => S("offre", `${titre(date)}${ligneprixFR()}${ligneCode(FR)}${tel(1)}<div class="bas">${cta(FR.profite)}</div>`);
const ligneprixFR = () => lignePrix(FR);
const storyFin = (date, compte) => S("fin", `${titre(date)}<p class="compte">${compte}</p>${ligneprixFR()}${ligneCode(FR)}${tel(1)}<div class="bas">${cta(FR.profite)}</div>`);

/* ===== Posts Meta (FR, 1080 × 1350) ===== */
const P = (cls, date, gauche, lum, extra = "") => `<div class="kv post ${cls}" style="--w:360px;--h:450px;--u:10px">${titre(date)}<div class="gauche">${gauche}</div>${extra}${tel(lum)}</div>`;
const postTeasing = () => P("question", FR.dTeasing, `<h3 class="accroche">${FR.question}</h3><p class="sous">${FR.rdv}</p>${rdv("Le 27/11 dans l'app")}`, .3);
const postJourJ = () => P("offre", `<small>c'est parti !</small>`, `${tag}<p class="sous">Le GPS Premium à moitié prix, jusqu'au 30/11.</p>${prix(FR)}${cta(FR.profite)}`, 1, `<div class="code-haut">${code(FR)}</div>`);
const postDernier = () => P("offre", FR.dFin, `${tag}<p class="sous">Dernier jour pour avoir le GPS Premium à moitié prix.</p>${prix(FR)}${cta(FR.profite)}`, 1, `<div class="code-haut">${code(FR)}</div>`);

/* ===== Messages in-app (par langue, 1170 × 2532) ===== */
const M = (cls, inner) => `<div class="kv v iam fondu ${cls}" style="--w:390px;--h:844px;--u:${390 / 36}px">${logo}${inner}</div>`;
const iamTeasing = t => M("question", `${titre(t.dTeasing)}<h3 class="accroche">${t.question}</h3><p class="sous">${t.rdv}</p>${tel(.3)}
  <div class="bas">${cta(t.notif, true)}<span class="plus-tard">${t.plusTard}</span><p class="legal">${t.note}</p></div>`);
// Segments du 27/11 : ceux qui ont cliqué « Préviens-moi » et ceux qui ont cliqué « Plus tard »
const iamSeg = (t, date, msg, sous) => M("seg", `${titre(date)}<p class="msg">${msg}</p>${lignePrix(t)}${sous ? `<p class="sous">${sous}</p>` : ""}${ligneCode(t)}${tel(1)}
  <div class="bas">${cta(t.profite)}<p class="legal">${t.legal}</p></div>`);
const iamInteresses = t => iamSeg(t, t.dJ, t.msgInteresse, t.offre);
const iamPlusTard = t => iamSeg(t, t.dJusqua, t.msgPlusTard, t.sousPlusTard);
const iamOffre = t => M("offre", `${titre(t.dOffre)}${lignePrix(t)}<p class="sous">${t.offre}</p>${ligneCode(t)}${tel(1)}
  <div class="bas">${cta(t.profite)}<p class="legal">${t.legal}</p></div>`);
const iamDernier = t => M("fin", `${titre(t.dFin)}<p class="compte">${t.dernier}</p>${lignePrix(t)}${ligneCode(t)}${tel(1)}
  <div class="bas">${cta(t.profite)}<p class="legal">${t.legal}</p></div>`);

/* ===== Bannières (par langue) ===== */
const funnel = (t, cls = "", dims = "--w:990px;--h:402px;--u:10px") => `<div class="kv funnel ${cls}" style="${dims}">${logo}<div class="col-titre">${titre(t.dOffre)}</div>

/* ===== Liste des visuels : id → [html, échelle d'export, légende, dossier] ===== */
const V = {};
const add = (id, html, ech, leg, dossier) => { V[id] = [html, ech, leg, dossier]; };

add("story-6-28-11-fin-3-jours", storyFin(`<small>jusqu'au</small>30/11`, "Plus que 3 jours"), 3, "<b>28/11</b> · Plus que 3 jours", "reseaux/stories");
add("story-7-29-11-fin-1-jour", storyFin(`<small>fin</small>demain`, "Plus qu'un jour"), 3, "<b>29/11</b> · Plus qu'un jour", "reseaux/stories");
add("story-8-30-11-fin-heures", storyFin(FR.dFin, "Plus que quelques heures"), 3, "<b>30/11</b> · Plus que quelques heures", "reseaux/stories");
// Posts Meta
add("post-1-20-11-teasing", postTeasing(), 3, "<b>Post 1 · 20/11</b> · Teasing", "reseaux/posts-meta");
add("post-2-27-11-jour-j", postJourJ(), 3, "<b>Post 2 · 27/11</b> · Jour J", "reseaux/posts-meta");
add("post-3-30-11-dernier-jour", postDernier(), 3, "<b>Post 3 · 30/11</b> · Dernier jour", "reseaux/posts-meta");
// App, par langue
for (const lg of LANGS) {
  telLangue = lg === "fr" ? TEL : `assets/telephone-gps-${lg}.png`;
  const t = L[lg], up = lg.toUpperCase();
  add(`message-in-app-1-teasing-${lg}`, iamTeasing(t), 3, `<b>${up}</b> · Teasing · 20 → 26/11`, `app/${lg}`);
  add(`message-in-app-2a-interesses-${lg}`, iamInteresses(t), 3, `<b>${up}</b> · Segment « Préviens-moi » · 27/11`, `app/${lg}`);
  add(`message-in-app-2-offre-${lg}`, iamOffre(t), 3, `<b>${up}</b> · Offre · 27 → 29/11`, `app/${lg}`);
  add(`message-in-app-3-dernier-jour-${lg}`, iamDernier(t), 3, `<b>${up}</b> · Dernier jour · 30/11`, `app/${lg}`);
  add(`banniere-funnel-990x402-${lg}`, funnel(t), 1, `<b>${up}</b> · 990 × 402 · 27 → 30/11`, `app/${lg}`);
  add(`banniere-brevo-2030x889-${lg}`, funnel(t, "brevo", "--w:2030px;--h:889px;--u:20.505px"), 1, `<b>${up}</b> · Brevo 2030 × 889 · 27 → 30/11`, `brevo/${lg}`);
  telLangue = TEL;

/* ===== Affichage ===== */
const q = new URLSearchParams(location.search);
const el = document.getElementById("planche");
const wrap = (id, html) => html.replace(/^<div class="kv/, `<div id="${id}" class="kv`);
if (q.get("solo")) {
  document.body.style.padding = "0"; el.style.width = "auto";
  const id = q.get("solo"); el.innerHTML = wrap(id, V[id][0]);
} else {
  const fig = id => `<figure>${wrap(id, V[id][0])}<figcaption>${V[id][2]}</figcaption></figure>`;
  const sec = (t, d, rangees) => `<div class="section"><h2>${t}</h2><p>${d}</p>${rangees.map(ids => `<div class="rangee">${ids.map(fig).join("")}</div>`).join("")}</div>`;
  const ids = pre => Object.keys(V).filter(k => k.startsWith(pre));
  const parLangue = pre => LANGS.map(lg => `${pre}-${lg}`);
  if (q.get("vue") === "app") {
    el.style.width = "3060px";
    el.innerHTML = `<h1>Black Friday 2026 · App · 7 langues</h1>
      <p>FR, EN (UK), DE, IT, ES, NL, PL. Tutoiement dans toutes les langues (règle Truckfly B2C). Prix : 37,99 € (zone euro), £31.99 (UK), 166,99 zł (PL) ; prix barré = le double. Les messages in-app reprennent le visuel des anciens interstitiels.</p>` +
      sec("1 · Message in-app teasing", "Du 20 au 26/11. Deux boutons : « Préviens-moi le 27/11 » (segment intéressés) et « Plus tard » (segment plus tard).", [parLangue("message-in-app-1-teasing")]) +
      sec("2a · Segment « Préviens-moi » · 27/11", "Pour ceux qui ont cliqué « Préviens-moi » pendant le teasing.", [parLangue("message-in-app-2a-interesses")]) +
      sec("2 · Message in-app offre (tous les autres)", "Du 27 au 29/11, pour ceux qui n'ont pas vu le teasing ou n'ont rien cliqué.", [parLangue("message-in-app-2-offre")]) +
      sec("3 · Message in-app dernier jour", "Le 30/11, pour tous ceux qui n'ont pas encore acheté.", [parLangue("message-in-app-3-dernier-jour")]) +
      sec("4 · Bannière funnel d'achat · 990 × 402", "Pendant l'offre, du 27 au 30/11.", [0, 3, 6].map(i => parLangue("banniere-funnel-990x402").slice(i, i + 3))) +
      sec("5 · Bannière e-mail Brevo · 2030 × 889", "Pendant l'offre, du 27 au 30/11.", [0, 3, 6].map(i => parLangue("banniere-brevo-2030x889").slice(i, i + 3)));

      <p>GPS Premium à -50 % : 37,99 €/an au lieu de 74,99 €, du 27/11 au 30/11/2026. Teasing dès le 20/11 : la question, puis un compte à rebours où le téléphone sort de l'ombre. Le 27/11 l'offre s'allume, puis compte à rebours jusqu'au 30/11 à minuit.</p>` +
      sec("1 · Stories · du 20 au 30/11", "Teasing (4), jour J (1), compte à rebours fin d'offre (3).", [ids("story-").slice(0, 4), ids("story-").slice(4)]) +
      sec("2 · Posts Meta · 1080 × 1350", "Teasing, jour J, dernier jour.", [ids("post-")]);

window.EXPORTS = Object.entries(V).map(([id, v]) => [id, v[1], v[3]]);
