.planche > p { margin: 8px 0 40px; color: #53565A; font-size: 15px; max-width: 1100px; line-height: 1.45; }
.section { margin-bottom: 56px; }
.section h2 { font: 900 italic 20px "Titre"; text-transform: uppercase; color: #111; }
.section h2 + p { font-size: 14px; color: #53565A; margin: 4px 0 18px; }
.rangee { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
.rangee + .rangee { margin-top: 28px; }
figure { display: flex; flex-direction: column; gap: 8px; }
figcaption { font-size: 12px; color: #53565A; }
figcaption b { color: #111; }

/* ---------- Éléments communs ---------- */
.kv { position: relative; isolation: isolate; overflow: hidden; color: var(--blanc); font-size: var(--u); width: var(--w); height: var(--h);
  background: radial-gradient(90% 55% at 80% 80%, #26262e 0%, transparent 70%), var(--noir); }
.logo { height: 2.5em; width: auto; align-self: flex-start; display: block; position: relative; z-index: 4; }
.titre { position: relative; display: flex; justify-content: center; align-items: center; }
/* Trait blanc : tout au fond, derrière le téléphone et les textes */
.titre .ligne { position: absolute; z-index: -1; left: -5em; right: -5em; top: 50%; height: .12em; background: rgba(255,255,255,.9); }
.boite { position: relative; z-index: 2; background: var(--blanc); color: #111; border-radius: .8em;
  font: 900 italic 4.2em/1.02 "Titre"; text-transform: uppercase; text-align: center; padding: .28em .5em .3em; }
.boite span { display: block; }
.date { position: absolute; z-index: 3; left: 50%; bottom: -1.5em; transform: translateX(-50%) rotate(-3deg);
  background: var(--jaune); color: #111; border-radius: .5em; white-space: nowrap;
  font: 900 italic 2.1em/1 "Titre"; text-transform: uppercase; padding: .45em .7em .4em; box-shadow: 0 .2em .6em rgba(0,0,0,.3); }
.date small { font-size: .62em; margin: 0 .25em; vertical-align: .12em; }
.sous { font: italic 600 1.45em/1.35 "Texte"; color: var(--gris); }
.sous b { color: var(--blanc); font-weight: 700; }
.tag { position: relative; display: inline-flex; background: var(--jaune); color: #111;
  font: 900 italic 1em/1 "Titre"; white-space: nowrap;
  clip-path: polygon(16% 0, 100% 0, 100% 100%, 16% 100%, 0 50%); padding: .16em .32em .12em .66em; transform: rotate(-8deg); }
.tag i { position: absolute; left: .2em; top: 50%; width: .14em; height: .14em; margin-top: -.07em; border-radius: 50%; background: #111; }
.tag small { font-size: .42em; margin-left: .06em; margin-top: .22em; }
.prix { display: flex; flex-direction: column; gap: .35em; white-space: nowrap; }
.prix .n { font: 900 italic 2.9em/1 "Titre"; }
.prix .n em { font: italic 600 .45em "Texte"; margin-left: .15em; }
.prix .barre { font: italic 600 1.45em/1 "Texte"; color: var(--barre); text-decoration: line-through; }
.cta { display: inline-flex; justify-content: center; align-items: center; font: 900 italic 1.4em/1 "Titre"; text-transform: uppercase;
  background: var(--jaune); color: #111; padding: .95em 1.5em; border-radius: .6em; white-space: nowrap; box-shadow: 0 .4em 1.2em rgba(0,0,0,.35); }
.cta.contour { background: var(--noir); color: var(--blanc); box-shadow: inset 0 0 0 .12em var(--blanc), 0 .4em 1.2em rgba(0,0,0,.35); }
.tel { position: absolute; filter: drop-shadow(0 1.6em 2.4em rgba(0,0,0,.5)); z-index: 1; }
.tel.ombre { filter: brightness(var(--lum)) saturate(.6) drop-shadow(0 1.6em 2.4em rgba(0,0,0,.6)); }
.halo { position: absolute; z-index: 0; width: 44em; height: 44em; left: 50%; margin-left: -22em; top: 26em;
  background: radial-gradient(closest-side, rgba(255,255,255,.16), rgba(255,255,255,.04) 55%, transparent 100%); }
.fondu::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 2;
  background: linear-gradient(transparent, rgba(10,10,12,.92) 70%); }
.accroche { position: relative; z-index: 3; font: 900 italic 2.5em/1.1 "Titre"; color: var(--blanc); }
.compte { position: relative; z-index: 3; font: italic 400 1.6em/1.1 "Texte"; color: var(--blanc); white-space: nowrap; text-align: center; }
.rdv { display: flex; align-items: center; gap: .9em; font: italic 700 1.15em/1 "Texte"; letter-spacing: .12em; text-transform: uppercase; color: var(--blanc); white-space: nowrap; }
.rdv::before, .rdv::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.55); }

/* ---------- Story 9:16 et message in-app (même mise en page) ---------- */
.v { padding: 2.6em; }
.v .titre { margin-top: 3.4em; }
.v .date { font-size: 2.5em; bottom: -1.6em; }
.v .ligne-prix { display: flex; align-items: center; gap: 1em; position: relative; z-index: 3; }
.v .tag { font-size: 4.2em; flex: none; }
.v .tel { width: 22em; left: 50%; margin-left: -11em; }
.v .bas { position: absolute; z-index: 3; left: 2.6em; right: 2.6em; bottom: 2.6em; display: flex; flex-direction: column; align-items: center; gap: 1.1em; }
.v .bas .cta, .v .bas .rdv { align-self: stretch; }
.v .legal { font: italic 400 .95em/1.35 "Texte"; color: var(--barre); text-align: center; }
/* Question teasing */
.v.question .accroche { margin-top: 2.4em; text-align: center; }
.v.question .tel { top: 36em; }
.iam.question .sous { margin-top: 1.4em; position: relative; z-index: 3; text-align: center; }
.iam.question .tel { top: 40em; }
.iam.question .halo { top: 30em; }
/* Compte à rebours avant lancement */
.v.avant .compte { margin-top: 3.4em; }
.v.avant .sous { margin-top: 1em; position: relative; z-index: 3; text-align: center; }
.v.avant .tel { top: 34.5em; }
.v.avant .halo { top: 25em; }
/* Offre */
.v.offre .ligne-prix { margin-top: 6.6em; }
.v.offre .tel { top: 38.5em; }
.story .ligne-code { margin-top: 1.6em; }
.story .code { font-size: 2.3em; }
.iam.offre .sous { margin-top: 2.2em; position: relative; z-index: 3; }
.iam.offre .tel { top: 46.5em; }
/* Compte à rebours fin d'offre */
.v.fin .compte { margin-top: 3.71em; }
.v.fin .ligne-prix { margin-top: 2.5em; }
.v.fin .tel { top: 42em; }
.iam.fin .date { font-size: 2.1em; bottom: -1.9em; }
.iam.fin .tel { top: 45.5em; }
.v .plus-tard { font: italic 600 1.35em/1 "Texte"; color: var(--gris); text-decoration: underline; }
.iam.question .tel { top: 41em; }
/* Messages segmentés */
.iam.seg .msg { position: relative; z-index: 3; margin-top: 3.6em; font: italic 400 1.6em/1.3 "Texte"; text-align: center; color: var(--blanc); }
.iam.seg .ligne-prix { margin-top: 1.6em; justify-content: center; }
.iam.seg .sous { position: relative; z-index: 3; margin-top: 1.6em; text-align: center; }
.iam.seg .tel { top: 49em; }
.iam .tag { font-size: 3.7em; }
.iam .ligne-prix { gap: .8em; }
/* Coupon BF50 centré entre le texte du dessus et le téléphone */
.iam.offre .ligne-code { margin-top: 2.2em; }
.iam.seg .ligne-code { margin-top: 2.42em; }
.iam.fin .ligne-code { margin-top: 3.43em; }
/* Prix long (PL) : un peu plus petit pour tenir dans la largeur */
.iam .ligne-prix.long .tag { font-size: 3.3em; }
.iam .ligne-prix.long .prix .n { font-size: 2.5em; }

/* ---------- Post 4:5 ---------- */
.post { padding: 2.4em; }
.post .titre { margin-top: 1.8em; justify-content: flex-start; width: 21.4em; }
.post .boite { font-size: 3.4em; }
.post .date { font-size: 1.6em; }
.post .titre .ligne { right: -14em; }
.post .gauche { position: relative; z-index: 2; width: 18em; margin-top: 3.2em; display: flex; flex-direction: column; gap: 1.3em; }
.post .accroche { font-size: 1.62em; }
.post .tag { font-size: 4.4em; align-self: flex-start; }
.post .sous { font-size: 1.3em; }
.post .prix .n { font-size: 2.6em; }
.post .cta { align-self: flex-start; font-size: 1.2em; }
.post .rdv::after { display: none; }
.post .rdv::before { flex: none; width: 2.4em; }
.post .tel { width: 12em; right: 2.2em; top: 17.4em; transform: rotate(5deg); }
.post .halo { width: 30em; height: 30em; left: auto; right: -8em; margin-left: 0; top: 10em; }

/* ---------- Bannière funnel d'achat 990 × 402 ---------- */
.funnel { display: flex; align-items: center; padding: 0 20em 0 4em; gap: 1.2em; }
.funnel .logo { position: absolute; top: 3em; left: 4em; height: 2.8em; }
.funnel .col-titre { flex: none; position: relative; margin-top: 2.6em; }
.funnel .boite { font-size: 4.6em; }
.funnel .date { font-size: 2em; bottom: -1.7em; }
.funnel .titre .ligne { left: -6em; right: -80em; }
.funnel .col-offre { display: flex; flex-direction: column; gap: 1.8em; position: relative; z-index: 2; margin-top: 1em; }
.funnel .col-offre { gap: 1.6em; flex: 1; align-items: center; }
/* Bloc offre centré entre le titre et le téléphone */
.funnel .tag { font-size: 4.2em; }
.funnel .prix .n { font-size: 2.8em; }
.funnel .code { font-size: 4em; align-self: center; }
.funnel .actions { display: flex; flex-direction: column; align-items: center; gap: .9em; margin-top: .8em; }
/* -50 % et prix collés au cartouche Black Friday */
.funnel .ligne-prix { align-self: flex-start; margin-left: -1.6em; margin-bottom: -1.5em; position: relative; z-index: 4; }
/* La pointe de l'étiquette vient toucher le cartouche Black Friday */
.funnel .ligne-prix .tag { transform: translateY(1.07em) rotate(-8deg); }
/* Coupon BF50 centré sur le trait blanc ; bouton et date suivent */
.funnel .actions { position: relative; top: 2.84em; }
.funnel .ligne-prix .prix { position: absolute; left: 3em; bottom: 100%; margin-bottom: -3.2em; } /* prix au-dessus de l'étiquette */
.funnel .code { position: relative; top: .71em; } /* 2,84 × 10 px, rapporté à la taille du code */
.funnel .rappel { font: italic 600 1.35em/1.2 "Texte"; color: var(--gris); }
/* Code promo : coupon en pointillés, blanc (pas de gros texte jaune) */
.code { position: relative; z-index: 3; display: inline-flex; align-items: baseline; gap: .4em; white-space: nowrap;
  font: 900 italic 2.6em/1 "Titre"; letter-spacing: .05em; color: #111; background: var(--blanc); padding: .32em .6em .3em;
  border-radius: .3em; outline: .05em dashed #111; outline-offset: -.2em; box-shadow: 0 .15em .5em rgba(0,0,0,.35); }
.code small { font: italic 700 .42em "Texte"; letter-spacing: .08em; text-transform: uppercase; color: #53565A; }
.ligne-code { position: relative; z-index: 3; display: flex; justify-content: center; margin-top: 1.4em; }
.post .code { font-size: 2em; }
/* Coupon du code en haut à droite, au-dessus du téléphone */
.post .code-haut { position: absolute; z-index: 3; right: 2.4em; top: 12.7em; width: 12em; display: flex; justify-content: center; }
.post.offre .gauche { gap: 1.05em; margin-top: 2.8em; }
.funnel .ligne-prix { display: flex; align-items: center; gap: 1.6em; }
.funnel .tag { flex: none; }
.funnel .prix .barre { font-size: 1.5em; }
.funnel .cta { font-size: 1.6em; }
.funnel .tel { width: 15em; right: 3.5em; top: 3.6em; transform: rotate(5deg); }
/* Flèche jaune qui part du code et descend vers la droite */
.brevo .tel { top: 2.9em; right: 3.4em; width: 14.2em; }
/* Brevo : fond noir uni, sans logo, éléments agrandis */
.kv.brevo { background: #000; }
.brevo .logo { display: none; }
.brevo.funnel { padding: 0 18.5em 0 3em; }
.brevo .col-titre { margin-top: 1.4em; }
.brevo .logo { top: 3.4em; }
.brevo .fleche-bas { display: none; } /* la flèche sert seulement dans le funnel d'achat */
.funnel .fleche-bas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; filter: drop-shadow(0 .2em .4em rgba(0,0,0,.4)); }


/* ---------- Réseaux : sans logo, contenu remonté et mieux réparti ---------- */
.story .titre { margin-top: 1.6em; }
.story .bas { bottom: 3.6em; }
.story.question .accroche { margin-top: 3.6em; }
.story.question .tel { top: 33.5em; }
.story.question .halo { top: 23.5em; }
.story.avant .compte { margin-top: 4.6em; }
.story.avant .sous { margin-top: 1.4em; }
.story.avant .tel { top: 32.5em; }
.story.avant .halo { top: 23em; }

.story .ligne-code { margin-top: 2.6em; }

.story.fin .tel { top: 40.5em; }

.post .gauche { margin-top: 5em; gap: 2.2em; }
.post.offre .gauche { margin-top: 4.2em; gap: 1.9em; }
.post .tel { top: 16.4em; }
.post .halo { top: 8em; }

/* ---------- Sans prix : l'étiquette -50 % seule, centrée et plus grande ---------- */
