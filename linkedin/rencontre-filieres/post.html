<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>LinkedIn : Rencontre des filières</title>
<!-- Post LinkedIn 4:5, fond Michelin Blue. Maquette en 360 × 450 px (échelle de la charte), exportée par rendre.mjs. -->
<style>
@font-face { font-family: "Bib"; src: url("../../ma-video/assets/fonts/BIB-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Bib"; src: url("../../ma-video/assets/fonts/BIB-Light.woff2") format("woff2"); font-weight: 300; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
:root { --bleu: #061866; --jaune: #FFFF1A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 360px; height: 450px; overflow: hidden; background: var(--bleu); }
.post { position: relative; width: 360px; height: 450px; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
  background: radial-gradient(120% 80% at 70% 15%, #10287f 0%, var(--bleu) 55%, #000e38 100%); }
.post > * { position: absolute; }
.structure { inset: 0; width: 100%; height: 100%; }

.surtitre { right: 48px; top: 54px; font-weight: 600; font-size: 12px; color: var(--jaune); }
.bloc { left: 52px; right: 48px; top: 136px; }
.bloc h1 { font-family: "Bib", sans-serif; font-weight: 700; font-size: 43px; line-height: 48px; }
.date { margin-top: 22px; font-family: "Bib", sans-serif; font-weight: 700; font-size: 24px; line-height: 28px; color: var(--jaune); }
.trait { margin-top: 26px; width: 48px; height: 2px; background: #fff; }
.bloc p { margin-top: 18px; font-size: 15px; line-height: 21px; max-width: 250px; }
.marque { left: 52px; bottom: 30px; font-family: "Bib", sans-serif; font-weight: 300; font-size: 15px; letter-spacing: 0.2px; }
.marque b { font-weight: 700; }
</style>
</head>
<body>
<main class="post">
  <img class="structure" src="assets/structure-4x5-white.png" alt="" />
  <p class="surtitre">Aujourd’hui</p>
  <div class="bloc">
    <h1>Rencontre des filières</h1>
    <p class="date">Jeudi 22 octobre</p>
    <div class="trait"></div>
    <p>Retrouvez l’équipe Michelin Truckfly sur place pour échanger sur le quotidien des conducteurs.</p>
  </div>
  <p class="marque"><b>Michelin</b> Truckfly</p>
</main>
</body>
</html>
