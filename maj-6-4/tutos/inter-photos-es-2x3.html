<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tutoriel inter-photos-es (2x3)</title>
<style>
@font-face { font-family: "Bib"; src: url("../../ma-video/assets/fonts/BIB-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-Bold.otf") format("opentype"); font-weight: 700; }
:root { --bleu: #061866; --clair: #F5F3F1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bleu); }
.video { position: relative; width: var(--w); height: var(--h); overflow: hidden; font-family: "Inter", sans-serif; }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene.bleu { background: var(--bleu); color: #fff; }
.scene.clair { background: var(--clair); color: var(--bleu); }
.texte { position: absolute; display: flex; flex-direction: column; }
.pastille { width: var(--pastille); height: var(--pastille); border-radius: 50%; background: var(--bleu); color: #fff;
  display: flex; align-items: center; justify-content: center; font-family: "Bib", sans-serif; font-weight: 700; font-size: calc(var(--pastille) * 0.56); }
h1 { font-family: "Bib", sans-serif; font-weight: 700; font-size: var(--titre); line-height: 1.12; text-wrap: balance; }
.sous { font-size: var(--sous); line-height: 1.3; text-wrap: balance; opacity: 0.9; }
.tel { position: absolute; overflow: hidden; border-radius: 15% / 7.5%; }
.tel-zoom { position: relative; width: 100%; height: 100%; }
.tel img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.28)); }
.scene.bleu .tel img { filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.5)); }
.tap { position: absolute; width: 13%; aspect-ratio: 1; margin: -6.5% 0 0 -6.5%; border-radius: 50%;
  border: 3px solid var(--bleu); background: rgba(255, 255, 255, 0.35); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8); }
/* Feuille de choix de langue (recréée, au style de l'app) */
.tel-zoom { container-type: size; }
.voile-ecran { position: absolute; left: 4.5%; right: 4.5%; top: 2.5%; bottom: 2.5%; border-radius: 9% / 4.5%; background: rgba(0, 0, 0, 0.35); }
.feuille { position: absolute; left: 4.5%; right: 4.5%; bottom: 2.5%; height: 55%; background: #fff; border-radius: 6cqw 6cqw 9% 9% / 6cqw 6cqw 4.5% 4.5%;
  padding: 5cqw 6cqw; color: #000; font-family: "Inter", sans-serif; }
.f-titre { font-weight: 700; font-size: 5cqw; color: var(--bleu); text-align: center; margin-bottom: 2cqw; }
.feuille ul { list-style: none; }
.feuille li { display: flex; justify-content: space-between; align-items: center; height: 7.2cqh; border-bottom: 1px solid #e6e6ea; font-size: 4.4cqw; font-weight: 600; }
.coche { color: var(--bleu); font-size: 5cqw; }


@keyframes apparait { from { opacity: 0; } to { opacity: 1; } }
@keyframes disparait { from { opacity: 1; } to { opacity: 0; } }
@keyframes efface { to { opacity: 0; } }
@keyframes monte { from { opacity: 0; transform: translateY(30px); } }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes feuille { from { transform: translateY(105%); } }
@keyframes zoome { from { transform: scale(1); } to { transform: scale(var(--s)); } }
@keyframes dezoome { from { transform: scale(var(--s)); } to { transform: scale(1); } }
@keyframes tape {
  0% { opacity: 0; transform: scale(1.7); }
  30% { opacity: 1; transform: scale(1); }
  55% { opacity: 1; transform: scale(0.8); }
  100% { opacity: 0; transform: scale(1); }
}

:root { --w: 384px; --h: 576px; --titre: 27px; --titre-fin: 32px; --sous: 15px; --pastille: 34px; --marge: 40px; }
.scene:not(.seul) { display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 14px 40px; }
.scene:not(.seul) .texte { position: relative; align-items: center; text-align: center; gap: 8px; }
.tel { position: relative; height: 350px; flex: none; }
.tap { border-width: 2px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8); }
.cta { margin-top: 26px; padding: 0 22px; height: 46px; border-radius: 12px; background: #FFFF1A; color: #000;
  display: inline-flex; align-items: center; font-family: "Inter", sans-serif; font-weight: 700; font-size: 16px; }
@keyframes pouls { 50% { transform: scale(1.05); } }

.scene.seul .texte { inset: 0; width: auto; align-items: center; justify-content: center; text-align: center; padding: 0 var(--marge); }
.scene.seul h1 { font-size: var(--titre-fin); }
</style>
</head>
<body data-duree="15" data-w="384" data-h="576">
<main class="video">
  <section class="scene bleu" style="opacity: 1;">
    <div class="texte">
      <h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.2s both">¡Comparte tus fotos de la carretera!</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.15s both">
        <div class="tel-zoom" style="transform-origin:50% 50%; ">
          <img src="assets/fil-photo.png" alt="" />
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 3.2s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 3.3000000000000003s both">1</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 3.4000000000000004s both">Toca el botón de foto</h1>
      <p class="sous" style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 3.5500000000000003s both">en la ficha del establecimiento</p>
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 3.35s both">
        <div class="tel-zoom" style="transform-origin:50% 40%; --s:1.5; animation: zoome 0.6s ease-in-out 3.5s forwards, dezoome 0.6s ease-in-out 6.2s forwards">
          <img src="assets/etablissement-ajouter.png" alt="" /><i class="tap" style="left:50%; top:40%; animation: tape 0.9s ease-in-out 4.4s both"></i>
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 6.6s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 6.699999999999999s both">2</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 6.8s both">Tus amigos la ven en su feed de actividad</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 6.75s both">
        <div class="tel-zoom" style="transform-origin:50% 46%; --s:1.4; animation: zoome 0.6s ease-in-out 7.1s forwards, dezoome 0.6s ease-in-out 10.0s forwards">
          <img src="assets/fil-photo.png" alt="" />
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 10.4s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 10.5s both">3</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 10.6s both">Encuéntralas todas en tu perfil</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 10.55s both">
        <div class="tel-zoom" style="transform-origin:50% 50%; ">
          <img src="assets/profil-photos.png" alt="" /><i class="tap" style="left:49%; top:22%; animation: tape 0.9s ease-in-out 11.3s both"></i>
        </div>
      </div>
  </section>
  <section class="scene bleu seul" style="animation: apparait 0.25s ease-in-out 13.2s both">
    <div class="texte">
      <h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 13.399999999999999s both">¡Comparte tus mejores sitios!</h1>
      <a class="cta" style="animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1) 14.0s both, pouls 0.9s ease-in-out 14.799999999999999s both, pouls 0.9s ease-in-out 15.799999999999999s both">Añadir una foto</a>
    </div>
    
  </section>
</main>
</body>
</html>
