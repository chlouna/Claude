<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Tutoriel photos-communautaires (16x9)</title>
<style>
@font-face { font-family: "Bib"; src: url("../../ma-video/assets/fonts/BIB-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
@font-face { font-family: "Inter"; src: url("../../ma-video/assets/fonts/Inter-Bold.otf") format("opentype"); font-weight: 700; }
:root { --bleu: #061866; --clair: #F5F3F1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bleu); }
.video { position: relative; width: var(--w); height: var(--h); overflow: hidden; font-family: "Inter", sans-serif; }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene.bleu { background: var(--bleu); color: #fff; }
.scene.clair { background: var(--clair); color: var(--bleu); }
.texte { position: absolute; display: flex; flex-direction: column; }
.pastille { width: var(--pastille); height: var(--pastille); border-radius: 50%; background: var(--bleu); color: #fff;
  display: flex; align-items: center; justify-content: center; font-family: "Bib", sans-serif; font-weight: 700; font-size: calc(var(--pastille) * 0.56); }
h1 { font-family: "Bib", sans-serif; font-weight: 700; font-size: var(--titre); line-height: 1.12; text-wrap: balance; }
.sous { font-size: var(--sous); line-height: 1.3; text-wrap: balance; opacity: 0.9; }
.tel { position: absolute; overflow: hidden; border-radius: 15% / 7.5%; }
.tel-zoom { position: relative; width: 100%; height: 100%; }
.tel img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.28)); }
.scene.bleu .tel img { filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.5)); }
.tap { position: absolute; width: 13%; aspect-ratio: 1; margin: -6.5% 0 0 -6.5%; border-radius: 50%;
  border: 3px solid var(--bleu); background: rgba(255, 255, 255, 0.35); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8); }
/* Feuille de choix de langue (recréée, au style de l'app) */
.tel-zoom { container-type: size; }
.voile-ecran { position: absolute; left: 4.5%; right: 4.5%; top: 2.5%; bottom: 2.5%; border-radius: 9% / 4.5%; background: rgba(0, 0, 0, 0.35); }
.feuille { position: absolute; left: 4.5%; right: 4.5%; bottom: 2.5%; height: 55%; background: #fff; border-radius: 6cqw 6cqw 9% 9% / 6cqw 6cqw 4.5% 4.5%;
  padding: 5cqw 6cqw; color: #000; font-family: "Inter", sans-serif; }
.f-titre { font-weight: 700; font-size: 5cqw; color: var(--bleu); text-align: center; margin-bottom: 2cqw; }
.feuille ul { list-style: none; }
.feuille li { display: flex; justify-content: space-between; align-items: center; height: 7.2cqh; border-bottom: 1px solid #e6e6ea; font-size: 4.4cqw; font-weight: 600; }
.coche { color: var(--bleu); font-size: 5cqw; }


@keyframes apparait { from { opacity: 0; } to { opacity: 1; } }
@keyframes disparait { from { opacity: 1; } to { opacity: 0; } }
@keyframes efface { to { opacity: 0; } }
@keyframes monte { from { opacity: 0; transform: translateY(30px); } }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes feuille { from { transform: translateY(105%); } }
@keyframes zoome { from { transform: scale(1); } to { transform: scale(var(--s)); } }
@keyframes dezoome { from { transform: scale(var(--s)); } to { transform: scale(1); } }
@keyframes tape {
  0% { opacity: 0; transform: scale(1.7); }
  30% { opacity: 1; transform: scale(1); }
  55% { opacity: 1; transform: scale(0.8); }
  100% { opacity: 0; transform: scale(1); }
}

:root { --w: 960px; --h: 540px; --titre: 40px; --titre-fin: 50px; --sous: 22px; --pastille: 46px; --marge: 120px; }
.texte { left: 80px; width: 470px; top: 0; bottom: 0; justify-content: center; gap: 16px; }
.tel { left: 600px; top: 40px; height: 460px; }

.scene.seul .texte { inset: 0; width: auto; align-items: center; justify-content: center; text-align: center; padding: 0 var(--marge); }
.scene.seul h1 { font-size: var(--titre-fin); }

.trad { position: absolute; display: flex; align-items: center; white-space: nowrap; line-height: 1.15;
  font-family: "Inter", sans-serif; padding: 0 0.4cqw; }
.trad.bloc { display: block; white-space: normal; line-height: 1.3; padding: 0; }
.trad b { font-weight: 700; }
.trad-bouton { position: absolute; width: 8.6cqw; height: 8.6cqw; translate: -50% -50%; border-radius: 50%; background: #fff;
  box-shadow: 0 0.6cqw 2cqw rgba(0, 0, 0, 0.18); display: flex; align-items: center; justify-content: center; }
.trad-bouton svg { width: 55%; height: 55%; }
</style>
</head>
<body data-duree="24.6" data-w="960" data-h="540">
<main class="video">
  <section class="scene bleu" style="opacity: 1;">
    <div class="texte">
      <h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.2s both">Tu veux partager une photo de là où tu t’es arrêté&nbsp;?</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.15s both">
        <div class="tel-zoom" style="transform-origin:50% 50%; ">
          <img src="assets/fil-photo.png" alt="" />
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 4.5s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 4.6s both">1</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 4.7s both">Ouvre la fiche de l’établissement</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 4.65s both">
        <div class="tel-zoom" style="transform-origin:50% 50%; ">
          <img src="assets/etablissement-ajouter.png" alt="" />
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 8.3s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 8.4s both">2</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 8.5s both">Appuie sur «&nbsp;Ajouter&nbsp;»</h1>
      <p class="sous" style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 8.65s both">sur la photo</p>
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 8.450000000000001s both">
        <div class="tel-zoom" style="transform-origin:50% 40%; --s:1.5; animation: zoome 0.6s ease-in-out 8.6s forwards, dezoome 0.6s ease-in-out 12.0s forwards">
          <img src="assets/etablissement-ajouter.png" alt="" /><i class="tap" style="left:50%; top:40%; animation: tape 0.9s ease-in-out 9.6s both"></i>
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 12.5s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 12.6s both">3</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 12.7s both">Elle apparaît dans le fil d’activité de tes amis</h1>
      
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 12.65s both">
        <div class="tel-zoom" style="transform-origin:50% 46%; --s:1.4; animation: zoome 0.6s ease-in-out 13.1s forwards, dezoome 0.6s ease-in-out 16.3s forwards">
          <img src="assets/fil-photo.png" alt="" />
        </div>
      </div>
  </section>
  <section class="scene clair" style="animation: apparait 0.25s ease-in-out 16.7s both">
    <div class="texte">
      <span class="pastille" style="animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 16.8s both">4</span><h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 16.9s both">Et sur ton profil</h1>
      <p class="sous" style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 17.05s both">retrouve toutes les photos que tu as publiées</p>
    </div>
    <div class="tel" style="aspect-ratio: 289 / 571; animation: monte 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) 16.849999999999998s both">
        <div class="tel-zoom" style="transform-origin:50% 50%; ">
          <img src="assets/profil-photos.png" alt="" /><i class="tap" style="left:49%; top:22%; animation: tape 0.9s ease-in-out 17.8s both"></i>
        </div>
      </div>
  </section>
  <section class="scene bleu seul" style="animation: apparait 0.25s ease-in-out 21.2s both">
    <div class="texte">
      <h1 style="animation: monte 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) 21.4s both">Partage tes meilleurs spots&nbsp;!</h1>
      
    </div>
    
  </section>
</main>
</body>
</html>
