<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" /><title>Simulation Street View</title>
<!-- Écran recréé (illustration) : vue de rue d'un parking poids lourds, au style d'une appli de cartes.
     Pas de vraie image Street View ni de logo. Rendu par composer.py dans le cadre du téléphone. -->
<style>
@font-face { font-family: "Inter"; src: url("../../../ma-video/assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../../../ma-video/assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 263px; height: 573px; overflow: hidden; font-family: "Inter", sans-serif; }
.e { position: relative; width: 263px; height: 573px; overflow: hidden; background: #cfe3f3; }
.e > * { position: absolute; }
svg.scene { inset: 0; width: 100%; height: 100%; }
.statut { left: 0; right: 0; top: 0; height: 34px; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 24px 0; font-size: 10px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
.barre { left: 10px; right: 10px; top: 40px; height: 34px; border-radius: 17px; background: rgba(32,33,36,0.82);
  color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 10.5px; }
.barre b { font-weight: 600; } .barre small { display: block; font-size: 8px; opacity: 0.75; }
.barre .fleche { font-size: 15px; }
.boussole { right: 12px; top: 84px; width: 30px; height: 30px; border-radius: 50%; background: rgba(32,33,36,0.75);
  display: flex; align-items: center; justify-content: center; }
.mini { left: 10px; bottom: 26px; width: 74px; height: 74px; border-radius: 10px; border: 2px solid #fff;
  background: #e8eef3; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.etiquette { left: 50%; translate: -50% 0; bottom: 120px; background: rgba(32,33,36,0.82); color: #fff; font-size: 9px;
  padding: 4px 9px; border-radius: 10px; white-space: nowrap; }
</style></head>
<body><main class="e">
<svg class="scene" viewBox="0 0 263 573" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb6e6"/><stop offset="1" stop-color="#dbeaf6"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d9196"/><stop offset="1" stop-color="#5c6066"/></linearGradient>
  </defs>
  <rect width="263" height="573" fill="url(#ciel)"/>
  <!-- nuages -->
  <g fill="#fff" opacity="0.85"><ellipse cx="60" cy="120" rx="34" ry="9"/><ellipse cx="80" cy="114" rx="20" ry="8"/>
    <ellipse cx="200" cy="96" rx="28" ry="7"/></g>
  <!-- arbres au loin -->
  <g fill="#4f7a43"><ellipse cx="10" cy="236" rx="22" ry="20"/><ellipse cx="40" cy="240" rx="18" ry="16"/>
    <ellipse cx="240" cy="236" rx="24" ry="22"/><ellipse cx="262" cy="242" rx="18" ry="16"/></g>
  <!-- entrepôt -->
  <rect x="34" y="176" width="196" height="84" fill="#e9e6df"/>
  <rect x="34" y="168" width="196" height="12" fill="#2d4f8f"/>
  <text x="132" y="177.5" fill="#fff" font-size="7.5" font-weight="600" text-anchor="middle" font-family="Inter">ENTREPÔT · LIVRAISONS</text>
  <g fill="#9aa3ad">
    <rect x="46" y="205" width="30" height="55"/><rect x="86" y="205" width="30" height="55"/>
    <rect x="148" y="205" width="30" height="55"/><rect x="188" y="205" width="30" height="55"/></g>
  <g fill="#c7ccd2"><rect x="46" y="205" width="30" height="5"/><rect x="86" y="205" width="30" height="5"/>
    <rect x="148" y="205" width="30" height="5"/><rect x="188" y="205" width="30" height="5"/></g>
  <g fill="#1d2b4f" font-size="7" font-weight="600" text-anchor="middle" font-family="Inter">
    <text x="61" y="200">Quai 1</text><text x="101" y="200">Quai 2</text><text x="163" y="200">Quai 3</text><text x="203" y="200">Quai 4</text></g>
  <!-- camion à quai -->
  <g><rect x="148" y="214" width="30" height="40" fill="#f4f4f4" stroke="#b9bec4"/><rect x="152" y="252" width="22" height="6" fill="#2b2b2b"/></g>
  <!-- panneau -->
  <g><rect x="238" y="214" width="3" height="54" fill="#6b6f75"/><rect x="226" y="196" width="28" height="24" rx="3" fill="#1e5bb8"/>
    <text x="240" y="212" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="Inter">P</text></g>
  <!-- sol et marquages en perspective -->
  <polygon points="0,260 263,260 263,573 0,573" fill="url(#sol)"/>
  <g stroke="#f2f2f2" stroke-width="2.4" fill="none" opacity="0.9">
    <line x1="70" y1="262" x2="-80" y2="573"/><line x1="105" y1="262" x2="40" y2="573"/>
    <line x1="158" y1="262" x2="223" y2="573"/><line x1="193" y1="262" x2="343" y2="573"/></g>
  <g stroke="#f2f2f2" stroke-width="2" stroke-dasharray="14 12" opacity="0.8"><line x1="131.5" y1="268" x2="131.5" y2="573"/></g>
  <!-- semi-remorque garé à gauche -->
  <g transform="translate(-6 286)">
    <rect x="0" y="0" width="74" height="86" rx="3" fill="#fafafa" stroke="#c1c6cc"/>
    <rect x="6" y="8" width="62" height="10" fill="#c8102e"/>
    <rect x="4" y="86" width="66" height="10" fill="#2a2a2a"/>
    <circle cx="16" cy="100" r="8" fill="#1d1d1d"/><circle cx="58" cy="100" r="8" fill="#1d1d1d"/></g>
  <!-- tracteur garé à droite -->
  <g transform="translate(196 298)">
    <rect x="0" y="0" width="70" height="66" rx="8" fill="#1f4aa8"/>
    <rect x="8" y="8" width="54" height="24" rx="3" fill="#a9c9e6"/>
    <rect x="6" y="40" width="58" height="8" fill="#d9dde2"/>
    <rect x="2" y="66" width="66" height="10" fill="#2a2a2a"/>
    <circle cx="14" cy="80" r="8" fill="#1d1d1d"/><circle cx="56" cy="80" r="8" fill="#1d1d1d"/></g>
  <!-- flèches de déplacement -->
  <g fill="#fff" opacity="0.95"><path d="M131.5 404 l-18 14 h10 v10 h16 v-10 h10 z"/><path d="M131.5 480 l18 -14 h-10 v-10 h-16 v10 h-10 z" opacity="0.7"/></g>
</svg>
<div class="statut"><span>15:24</span><span>4G ▮</span></div>
<div class="barre"><span class="fleche">←</span><div><b>Parking poids lourds</b><small>Nestle, France</small></div></div>
<div class="boussole"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l5 10h-10z" fill="#ea4335"/><path d="M12 22l-5-10h10z" fill="#fff"/></svg></div>
<div class="etiquette">Entrée du site · 30 m</div>
<div class="mini"><svg viewBox="0 0 74 74" width="100%" height="100%">
  <rect width="74" height="74" fill="#e8eef3"/><rect x="0" y="32" width="74" height="10" fill="#fff"/><rect x="32" y="0" width="10" height="74" fill="#fff"/>
  <rect x="44" y="6" width="24" height="20" fill="#d9dde3"/><circle cx="37" cy="46" r="5" fill="#4285f4" stroke="#fff" stroke-width="2"/>
  <path d="M37 39 l-6 -10 h12 z" fill="#4285f4" opacity="0.35"/></svg></div>
</main></body></html>
